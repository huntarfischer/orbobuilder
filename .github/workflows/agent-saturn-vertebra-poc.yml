name: Agent Saturn Vertebra POC

on:
  push:
    branches:
      - agent/timespine-celestial-time-build
    paths:
      - "tools/pass5/CelestialWebPOC.swift"
      - "tools/pass5/TimespineResolutionFastPOC.swift"
      - "tools/pass5/StationTablePOC.swift"
      - "tools/pass5/build_body_oriented_timespine.py"
      - ".github/workflows/agent-saturn-vertebra-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  learn:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Confirm native Swift
        run: swift --version

      - name: Build pinned Swiss C
        run: |
          mkdir -p .forge/swisseph
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.dylib
          test -f .forge/swisseph/libswe.dylib

      - name: Fetch Swiss DE441 data
        run: |
          mkdir -p .forge/ephe
          base="https://raw.githubusercontent.com/aloistr/swisseph/$SWISS_COMMIT/ephe"
          for file in sepl_18.se1 semo_18.se1; do
            curl --fail --location --retry 4 --retry-all-errors "$base/$file" --output ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done

      - name: Compile Swift learning harnesses
        run: |
          mkdir -p .forge
          swiftc tools/pass5/CelestialWebPOC.swift -o .forge/CelestialWebPOC
          swiftc tools/pass5/TimespineResolutionFastPOC.swift -o .forge/TimespineResolutionPOC
          swiftc tools/pass5/StationTablePOC.swift -o .forge/StationTablePOC

      - name: Run Saturnian slinky specimen
        run: |
          .forge/CelestialWebPOC \
            --library "$PWD/.forge/swisseph/libswe.dylib" \
            --ephe-dir "$PWD/.forge/ephe" \
            --output "$PWD/.forge/saturn-vertebra-poc.json"

      - name: Build low medium high degree-time tables
        run: |
          .forge/TimespineResolutionPOC \
            --library "$PWD/.forge/swisseph/libswe.dylib" \
            --ephe-dir "$PWD/.forge/ephe" \
            --output-dir "$PWD/.forge/timespine-resolution"

      - name: Build seven body-oriented whole-degree tables
        run: |
          python3 tools/pass5/build_body_oriented_timespine.py \
            --input-dir "$PWD/.forge/timespine-resolution/low-1deg" \
            --output-dir "$PWD/.forge/body-oriented-timespine"

      - name: Build station table
        run: |
          .forge/StationTablePOC \
            --library "$PWD/.forge/swisseph/libswe.dylib" \
            --ephe-dir "$PWD/.forge/ephe" \
            --output "$PWD/.forge/station-table.json"

      - name: Compress binary tables for shipping-size comparison
        run: |
          find .forge/timespine-resolution -name '*.bin' -print0 | while IFS= read -r -d '' file; do
            gzip -9 -k "$file"
          done

      - name: Read resolution results
        run: |
          cat .forge/timespine-resolution/summary.json
          echo "--- raw and gzip totals ---"
          for dir in .forge/timespine-resolution/low-1deg .forge/timespine-resolution/medium-0_5deg .forge/timespine-resolution/high-0_1deg; do
            echo "$dir"
            find "$dir" -name '*.relative.bin' -print0 | xargs -0 stat -f '%z' | awk '{s+=$1} END {print "relative raw bytes=" s}'
            find "$dir" -name '*.relative.bin.gz' -print0 | xargs -0 stat -f '%z' | awk '{s+=$1} END {print "relative gzip bytes=" s}'
            find "$dir" -name '*.direct-jd.bin' -print0 | xargs -0 stat -f '%z' | awk '{s+=$1} END {print "direct raw bytes=" s}'
            find "$dir" -name '*.direct-jd.bin.gz' -print0 | xargs -0 stat -f '%z' | awk '{s+=$1} END {print "direct gzip bytes=" s}'
          done

      - name: Read seven body table results
        run: cat .forge/body-oriented-timespine/summary.json

      - name: Read station table results
        run: cat .forge/station-table.json

      - name: Upload Timespine learning specimens
        uses: actions/upload-artifact@v4
        with:
          name: timespine-learning-specimen
          path: |
            .forge/timespine-resolution/summary.json
            .forge/timespine-resolution/**/*.bin
            .forge/timespine-resolution/**/*.bin.gz
            .forge/body-oriented-timespine/summary.json
            .forge/body-oriented-timespine/*.csv
            .forge/station-table.json
          if-no-files-found: error
          compression-level: 0

# Learning branch only. No production ownership implied.
