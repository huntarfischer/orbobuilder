name: Pass 5 Zeitgeist Z0-Z30 Table

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/p22-duplicate-cleanup-staging
    paths:
      - ".github/workflows/pass5-zeitgeist-table.yml"
      - "native/OrboCore/Package.swift"
      - "native/OrboCore/Sources/ZeitgeistTableForgeTool/**"

permissions:
  contents: read

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  manufacture-zeitgeist-table:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Build pinned Swiss C library from Huntarfischer fork
        run: |
          mkdir -p .forge/swisseph .forge/ephe
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/huntarfischer/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.dylib
          test -f .forge/swisseph/libswe.dylib

      - name: Fetch pinned long-range Swiss DE441 planetary files from Huntarfischer fork
        run: |
          base="https://raw.githubusercontent.com/huntarfischer/swisseph/$SWISS_COMMIT/ephe"
          files=(
            seplm36.se1 seplm30.se1 seplm24.se1 seplm18.se1 seplm12.se1 seplm06.se1
            sepl_00.se1 sepl_06.se1 sepl_12.se1 sepl_18.se1 sepl_24.se1 sepl_30.se1
            sepl_36.se1 sepl_42.se1
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 4 --retry-all-errors \
              "$base/$file" \
              --output ".forge/ephe/$file"
            test -s ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done

      - name: Repair diagnostic print syntax in manufacture worktree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("native/OrboCore/Sources/ZeitgeistTableForgeTool/main.swift")
          lines = path.read_text().splitlines()
          out = []
          for line in lines:
              if 'print("Z22 firstAriesIngress=' in line:
                  out.append('    let oldStartDeltaText = String(format: "%.3f", oldStartDelta)')
                  out.append('    print("Z22 firstAriesIngress=\\(z22.firstAriesIngressUTC) oldP22StartDeltaSeconds=\\(oldStartDeltaText)")')
              elif 'print("Z23 firstAriesIngress=' in line:
                  out.append('    let oldEndFromZ23FirstText = String(format: "%.3f", oldEndFromZ23First)')
                  out.append('    print("Z23 firstAriesIngress=\\(z23.firstAriesIngressUTC) oldP22EndDeltaSeconds=\\(oldEndFromZ23FirstText)")')
              elif 'print("Z23 finalPiscesEgress=' in line:
                  out.append('    let oldEndFromZ23FinalText = String(format: "%.3f", oldEndFromZ23Final)')
                  out.append('    print("Z23 finalPiscesEgress=\\(z23.finalPiscesEgressUTC) oldP22EndDeltaSeconds=\\(oldEndFromZ23FinalText)")')
              else:
                  out.append(line)
          path.write_text("\n".join(out) + "\n")
          PY
          grep -n 'oldP22.*DeltaSeconds' native/OrboCore/Sources/ZeitgeistTableForgeTool/main.swift

      - name: Manufacture Z0-Z30 table with native Swift
        run: |
          swift run \
            --package-path native/OrboCore \
            -c release \
            ZeitgeistTableForgeTool \
            --library "$PWD/.forge/swisseph/libswe.dylib" \
            --ephe-dir "$PWD/.forge/ephe" \
            --json "$PWD/tools/pass5/p22-data/zeitgeist-z0-z30.json" \
            --csv "$PWD/tools/pass5/p22-data/zeitgeist-z0-z30.csv" \
            | tee /tmp/zeitgeist-table-manufacture.txt
          test -s tools/pass5/p22-data/zeitgeist-z0-z30.json
          test -s tools/pass5/p22-data/zeitgeist-z0-z30.csv
          grep -q '^rows=31$' /tmp/zeitgeist-table-manufacture.txt
          shasum -a 256 tools/pass5/p22-data/zeitgeist-z0-z30.json tools/pass5/p22-data/zeitgeist-z0-z30.csv \
            | tee /tmp/zeitgeist-table-sha256.txt
          wc -c tools/pass5/p22-data/zeitgeist-z0-z30.json tools/pass5/p22-data/zeitgeist-z0-z30.csv \
            | tee /tmp/zeitgeist-table-bytes.txt

      - name: Upload manufactured table for audit
        uses: actions/upload-artifact@v4
        with:
          name: zeitgeist-z0-z30
          if-no-files-found: error
          retention-days: 7
          path: |
            tools/pass5/p22-data/zeitgeist-z0-z30.json
            tools/pass5/p22-data/zeitgeist-z0-z30.csv
            /tmp/zeitgeist-table-manufacture.txt
            /tmp/zeitgeist-table-sha256.txt
            /tmp/zeitgeist-table-bytes.txt
