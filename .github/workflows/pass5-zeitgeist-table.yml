name: Pass 5 Zeitgeist Z0-Z30 Table

on:
  workflow_dispatch:
  push:
    branches:
      - agent/p22-duplicate-cleanup-staging
    paths:
      - ".github/workflows/pass5-zeitgeist-table.yml"
      - "native/OrboCore/Package.swift"
      - "native/OrboCore/Sources/ZeitgeistTableForgeTool/**"

permissions:
  contents: write

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  manufacture-zeitgeist-table:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Build pinned Swiss C library from Huntarfischer fork
        run: |
          mkdir -p .forge/swisseph .forge/ephe
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/huntarfischer/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.so
          test -f .forge/swisseph/libswe.so

      - name: Fetch pinned long-range Swiss DE441 planetary files from Huntarfischer fork
        run: |
          base="https://raw.githubusercontent.com/huntarfischer/swisseph/$SWISS_COMMIT/ephe"
          files=(
            seplm36.se1 seplm30.se1 seplm24.se1 seplm18.se1 seplm12.se1 seplm06.se1
            sepl_00.se1 sepl_06.se1 sepl_12.se1 sepl_18.se1 sepl_24.se1 sepl_30.se1
            sepl_36.se1 sepl_42.se1
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 4 --retry-all-errors \
              "$base/$file" \
              --output ".forge/ephe/$file"
            test -s ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done

      - name: Manufacture Z0-Z30 table with native Swift
        run: |
          swift run \
            --package-path native/OrboCore \
            -c release \
            ZeitgeistTableForgeTool \
            --library "$PWD/.forge/swisseph/libswe.so" \
            --ephe-dir "$PWD/.forge/ephe" \
            --json "$PWD/tools/pass5/p22-data/zeitgeist-z0-z30.json" \
            --csv "$PWD/tools/pass5/p22-data/zeitgeist-z0-z30.csv" \
            | tee /tmp/zeitgeist-table-manufacture.txt
          test -s tools/pass5/p22-data/zeitgeist-z0-z30.json
          test -s tools/pass5/p22-data/zeitgeist-z0-z30.csv
          grep -q '^rows=31$' /tmp/zeitgeist-table-manufacture.txt
          sha256sum tools/pass5/p22-data/zeitgeist-z0-z30.json tools/pass5/p22-data/zeitgeist-z0-z30.csv
          wc -c tools/pass5/p22-data/zeitgeist-z0-z30.json tools/pass5/p22-data/zeitgeist-z0-z30.csv

      - name: Persist frozen Zeitgeist table on staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/pass5/p22-data/zeitgeist-z0-z30.json \
            tools/pass5/p22-data/zeitgeist-z0-z30.csv
          if ! git diff --cached --quiet; then
            git commit -m "freeze canonical Z0-Z30 Zeitgeist table"
            git push origin HEAD:agent/p22-duplicate-cleanup-staging
          fi
