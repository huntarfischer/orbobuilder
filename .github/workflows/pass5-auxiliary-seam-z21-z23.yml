name: Pass 5 Auxiliary Seam Z21-Z23

on:
  workflow_dispatch:
  push:
    branches: [feature/aux-seam-z21-z23]
    paths:
      - ".github/workflows/pass5-auxiliary-seam-z21-z23.yml"
      - "tools/pass5/generate_auxiliary_seam_z21_z23.py"
      - "tools/pass5/auxiliary-seam-z21-z23-spec.json"

permissions:
  contents: write

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        body: [TrueBML, MeanBML, Chiron, Ceres, Pallas, Juno, Vesta, Eris]
    steps:
      - name: Checkout Aux branch
        uses: actions/checkout@v4

      - name: Build pinned Swiss C
        run: |
          mkdir -p .forge/swisseph
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.so
          test -f .forge/swisseph/libswe.so

      - name: Stage qualified DE441 main inputs
        run: |
          mkdir -p .forge/ephe
          base="https://raw.githubusercontent.com/aloistr/swisseph/$SWISS_COMMIT/ephe"
          for file in sepl_12.se1 sepl_18.se1 semo_12.se1 semo_18.se1 seas_12.se1 seas_18.se1; do
            curl --fail --location --retry 4 --retry-all-errors "$base/$file" --output ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done
          sha256sum .forge/ephe/*.se1 | sort

      - name: Stage qualified Eris long ephemeris
        if: matrix.body == 'Eris'
        run: |
          mkdir -p .forge/ephe/ast136
          curl --fail --location --retry 4 --retry-all-errors \
            "https://ephe.scryr.io/ephe/ast136/s136199.se1" \
            --output .forge/ephe/ast136/s136199.se1
          test -s .forge/ephe/ast136/s136199.se1
          head -c 32 .forge/ephe/ast136/s136199.se1 | strings | grep -q SWISSEPH
          head -c 512 .forge/ephe/ast136/s136199.se1 | strings | grep -q DE441
          sha256sum .forge/ephe/ast136/s136199.se1

      - name: Compile-check forge
        run: python -m py_compile tools/pass5/generate_auxiliary_seam_z21_z23.py

      - name: Forge ${{ matrix.body }}
        run: |
          python tools/pass5/generate_auxiliary_seam_z21_z23.py \
            --library .forge/swisseph/libswe.so \
            --ephe-dir .forge/ephe \
            --output-dir ".forge/aux/${{ matrix.body }}" \
            --source-commit "$SWISS_COMMIT" \
            --body "${{ matrix.body }}"

      - name: Upload ${{ matrix.body }} substrate
        uses: actions/upload-artifact@v4
        with:
          name: aux-${{ matrix.body }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: .forge/aux/${{ matrix.body }}/

  collect:
    needs: forge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Aux branch
        uses: actions/checkout@v4

      - name: Download all body substrates
        uses: actions/download-artifact@v4
        with:
          pattern: aux-*
          path: .forge/staged
          merge-multiple: false

      - name: Assemble canonical Aux substrate directory
        run: |
          rm -rf tools/pass5/auxiliary-seam-z21-z23
          mkdir -p \
            tools/pass5/auxiliary-seam-z21-z23/crossings \
            tools/pass5/auxiliary-seam-z21-z23/stations \
            tools/pass5/auxiliary-seam-z21-z23/retrograde-crossings \
            tools/pass5/auxiliary-seam-z21-z23/audits

          for body in TrueBML MeanBML Chiron Ceres Pallas Juno Vesta Eris; do
            src=".forge/staged/aux-$body"
            test -f "$src/crossings/$body.csv.gz"
            test -f "$src/stations/$body.csv.gz"
            test -f "$src/retrograde-crossings/$body.csv.gz"
            test -f "$src/audits/$body.json"
            test -f "$src/summary.json"
            cp "$src/crossings/$body.csv.gz" tools/pass5/auxiliary-seam-z21-z23/crossings/
            cp "$src/stations/$body.csv.gz" tools/pass5/auxiliary-seam-z21-z23/stations/
            cp "$src/retrograde-crossings/$body.csv.gz" tools/pass5/auxiliary-seam-z21-z23/retrograde-crossings/
            cp "$src/audits/$body.json" tools/pass5/auxiliary-seam-z21-z23/audits/
            cp "$src/summary.json" "tools/pass5/auxiliary-seam-z21-z23/audits/$body-summary.json"
          done

      - name: Build combined summary and manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('tools/pass5/auxiliary-seam-z21-z23')
          bodies = ['TrueBML','MeanBML','Chiron','Ceres','Pallas','Juno','Vesta','Eris']
          summaries = [json.loads((root/'audits'/f'{b}-summary.json').read_text()) for b in bodies]
          if any(s['status'] != 'PASS' for s in summaries):
              raise SystemExit('one or more body summaries did not PASS')
          first = summaries[0]
          for s in summaries[1:]:
              for key in ('span','startJDUT','z22StartJDUT','z23StartJDUT','endJDUT','swissVersion','swissSourceCommit','coordinateContract','flagsContract'):
                  if s[key] != first[key]:
                      raise SystemExit(f'cross-body provenance drift: {key}')

          sources = {}
          for s in summaries:
              for src in s['sourceFiles']:
                  path = src['path']
                  if path in sources and sources[path] != src:
                      raise SystemExit(f'cross-body source provenance drift: {path}')
                  sources[path] = src

          summary = {k:first[k] for k in ('span','startJDUT','z22StartJDUT','z23StartJDUT','endJDUT','swissVersion','swissSourceCommit','coordinateContract','flagsContract')}
          summary['sourceFiles'] = [sources[k] for k in sorted(sources)]
          summary['status'] = 'PASS'
          summary['tables'] = [s['tables'][0] for s in summaries]
          summary['canonicalTracks'] = [b for b in bodies if b != 'MeanBML']
          summary['companionTracks'] = ['MeanBML']
          (root/'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')

          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'manifest.json'):
              h = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append({'path': str(path.relative_to(root)), 'bytes': path.stat().st_size, 'sha256': h})
          manifest = {
              'status': 'PASS',
              'span': 'Z21-Z23',
              'bodyTrackCount': 8,
              'canonicalTrackCount': 7,
              'files': files,
              'bytesTotal': sum(x['bytes'] for x in files),
          }
          (root/'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Enforce complete seam
        run: |
          test "$(find tools/pass5/auxiliary-seam-z21-z23/crossings -name '*.csv.gz' | wc -l)" -eq 8
          test "$(find tools/pass5/auxiliary-seam-z21-z23/stations -name '*.csv.gz' | wc -l)" -eq 8
          test "$(find tools/pass5/auxiliary-seam-z21-z23/retrograde-crossings -name '*.csv.gz' | wc -l)" -eq 8
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('tools/pass5/auxiliary-seam-z21-z23')
          summary = json.loads((root/'summary.json').read_text())
          assert summary['status'] == 'PASS'
          assert len(summary['tables']) == 8
          for body in summary['tables']:
              assert body['status'] == 'PASS'
              assert body['crossingCount'] > 0
          print('AUXILIARY SEAM COMPLETE')
          PY

      - name: Commit manufactured Aux substrate
        run: |
          git config user.name "orbo-forge"
          git config user.email "orbo-forge@users.noreply.github.com"
          git add tools/pass5/auxiliary-seam-z21-z23
          if git diff --cached --quiet; then
            echo "Auxiliary seam substrate unchanged."
          else
            git commit -m "Manufacture Z21-Z23 auxiliary seam substrate"
            git push origin HEAD:feature/aux-seam-z21-z23
          fi
