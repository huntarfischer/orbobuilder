name: Synchronic Spine Act I through Atropos

on:
  push:
    branches:
      - feature/synchronic-spine
  workflow_dispatch:

jobs:
  act-i-through-atropos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner-only test copy
        run: |
          cp -R native/OrboCore "$RUNNER_TEMP/OrboCore"
          rm "$RUNNER_TEMP/OrboCore/Tests/OrboCoreTests/RingTests.swift"

      - name: Focused Synchronic Spine Pass A
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter SynchronicSpinePassATests

      - name: Focused Synchronic Spine Asteria
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter SynchronicSpineAsteriaTests

      - name: Focused Synchronic Spine Themis
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter SynchronicSpineThemisTests

      - name: Focused Synchronic Spine Oceanus
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter SynchronicSpineOceanusTests

      - name: Focused Synchronic Spine Rhea
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter SynchronicSpineRheaTests

      - name: Focused Synchronic Spine Pass B integration
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter SynchronicSpinePassBTests

      - name: Focused Synchronic Spine Atropos
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter SynchronicSpineAtroposTests

      - name: Accumulated OrboCore except known RingTests compiler blocker
        run: swift test --package-path "$RUNNER_TEMP/OrboCore"
