name: Pass 5 Z23 Relationship Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/p22-duplicate-cleanup-staging
    paths:
      - ".github/workflows/pass5-z23-relationship-diagnostic.yml"
      - "tools/pass5/ZeitgeistRelationshipForge.swift"

permissions:
  contents: read

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342
  Z22_START: "2386637.079399706"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Swiss and stage DE441
        run: |
          mkdir -p .forge/swisseph .forge/ephe
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/huntarfischer/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.so
          base="https://raw.githubusercontent.com/huntarfischer/swisseph/$SWISS_COMMIT/ephe"
          for file in sepl_18.se1 semo_18.se1; do curl -fsSL "$base/$file" -o ".forge/ephe/$file"; done
      - name: Compile and generate calibration slice
        run: |
          swiftc tools/pass5/ZeitgeistRelationshipForge.swift -O -o /tmp/forge
          mkdir -p /tmp/cal
          /tmp/forge --library "$PWD/.forge/swisseph/libswe.so" --ephe-dir "$PWD/.forge/ephe" --output-dir /tmp/cal --start-jd "$Z22_START" --end-jd "2386667.079399706" --offset-origin-jd "$Z22_START"
      - name: Diagnose canonical differences
        run: |
          python3 - <<'PY'
          import csv,gzip,collections,statistics,os,math
          start=float(os.environ['Z22_START']); end=2386667.079399706
          failures=[]
          for fam in ('major','minor'):
              gen=list(csv.DictReader(open(f'/tmp/cal/exact-{fam}-mundane-transits.csv')))
              with gzip.open(f'tools/pass5/p22-data/exact-{fam}-mundane-transits.csv.gz','rt',newline='') as f:
                  can=[x for x in csv.DictReader(f) if start <= float(x['civicTimeJulianDayUT']) < end]
              key=lambda x:(x['bodyA'],x['bodyB'],x['aspect'],x['ringDegrees'],x['orientation'])
              gd=collections.defaultdict(list); cd=collections.defaultdict(list)
              for x in gen: gd[key(x)].append(x)
              for x in can: cd[key(x)].append(x)
              assert gd.keys()==cd.keys(); errs=[]; offset_mismatch=0; micro_mismatch=0; details=[]
              for k in sorted(gd):
                  a=sorted(gd[k],key=lambda x:float(x['civicTimeJulianDayUT'])); b=sorted(cd[k],key=lambda x:float(x['civicTimeJulianDayUT']))
                  assert len(a)==len(b),(fam,k,len(a),len(b))
                  for x,y in zip(a,b):
                      signed=(float(x['civicTimeJulianDayUT'])-float(y['civicTimeJulianDayUT']))*86400; errs.append(signed)
                      om=x['civicTimeOffsetSeconds']!=y['civicTimeOffsetSeconds']; offset_mismatch+=om
                      am=round(float(x['bodyACelestialTimeDegrees'])*1e6)%360000000 != round(float(y['bodyACelestialTimeDegrees'])*1e6)%360000000
                      bm=round(float(x['bodyBCelestialTimeDegrees'])*1e6)%360000000 != round(float(y['bodyBCelestialTimeDegrees'])*1e6)%360000000
                      micro_mismatch += (am or bm)
                      if abs(signed)>=0.01 or om or am or bm:
                          details.append((abs(signed),signed,k,x,y))
              print(f'{fam}: rows={len(gen)} errMin={min(errs):.9f}s errMax={max(errs):.9f}s absMax={max(map(abs,errs)):.9f}s median={statistics.median(errs):.9f}s offsetMismatch={offset_mismatch} microMismatch={micro_mismatch}')
              buckets=collections.Counter(round(e,3) for e in errs); print(f'{fam}: topSignedErrorBucketsMs={buckets.most_common(12)}')
              for abs_err,signed,k,x,y in sorted(details,reverse=True)[:12]:
                  print('DIFF',fam,k,'signedSec',signed)
                  print(' GEN jd',x['civicTimeJulianDayUT'],'off',x['civicTimeOffsetSeconds'],'A',x['bodyACelestialTimeDegrees'],'B',x['bodyBCelestialTimeDegrees'],'res',x['exactAspectResidualArcSeconds'])
                  print(' CAN jd',y['civicTimeJulianDayUT'],'off',y['civicTimeOffsetSeconds'],'A',y['bodyACelestialTimeDegrees'],'B',y['bodyBCelestialTimeDegrees'],'res',y['exactAspectResidualArcSeconds'])
              failures += details
          if not failures: print('PASS exact calibration')
          else: print(f'DIAGNOSTIC COMPLETE differences={len(failures)}; full Z23 remains blocked')
          PY
