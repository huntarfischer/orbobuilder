name: Pass 5 Planetary Shadows Z21-Z23

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/p22-duplicate-cleanup-staging
    paths:
      - ".github/workflows/pass5-planetary-shadows.yml"
      - "tools/pass5/generate_planetary_shadow_table.py"

permissions:
  contents: write

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  manufacture-planetary-shadows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Build pinned Swiss C library from Huntarfischer fork
        run: |
          mkdir -p .forge/swisseph .forge/ephe
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/huntarfischer/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.so
          test -f .forge/swisseph/libswe.so

      - name: Fetch pinned long-range DE441 files from Huntarfischer fork
        run: |
          base="https://raw.githubusercontent.com/huntarfischer/swisseph/$SWISS_COMMIT/ephe"
          files=(
            seplm36.se1 seplm30.se1 seplm24.se1 seplm18.se1 seplm12.se1 seplm06.se1
            sepl_00.se1 sepl_06.se1 sepl_12.se1 sepl_18.se1 sepl_24.se1 sepl_30.se1 sepl_36.se1
            semom36.se1 semom30.se1 semom24.se1 semom18.se1 semom12.se1 semom06.se1
            semo_00.se1 semo_06.se1 semo_12.se1 semo_18.se1 semo_24.se1 semo_30.se1 semo_36.se1
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 4 --retry-all-errors "$base/$file" --output ".forge/ephe/$file"
            test -s ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done

      - name: Manufacture planetary shadow table
        run: |
          python3 tools/pass5/generate_planetary_shadow_table.py \
            --library "$PWD/.forge/swisseph/libswe.so" \
            --ephe-dir "$PWD/.forge/ephe" \
            --json "$PWD/tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.json" \
            --csv "$PWD/tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.csv" \
            | tee /tmp/planetary-shadow-manufacture.txt
          test -s tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.json
          test -s tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.csv
          grep -q '^rows=6691$' /tmp/planetary-shadow-manufacture.txt
          sha256sum tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.json tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.csv | tee /tmp/planetary-shadow-sha256.txt
          grep -q '^e834b139e4a01650d59e33d54667dfd0c50d790bcb4a46db0c00a6a6ee59fa09 ' /tmp/planetary-shadow-sha256.txt
          grep -q '^efe37424e8479f4e5ef6339342bfd9452ddfdf0af6e815baf5f5c6d6d9552457 ' /tmp/planetary-shadow-sha256.txt
          wc -c tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.json tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.csv | tee /tmp/planetary-shadow-bytes.txt

      - name: Audit topology ordering
        run: |
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.csv')))
          assert len(rows) == 6691
          for r in rows:
              a=float(r['preShadowStartJulianDayUT']); b=float(r['retrogradeStationJulianDayUT'])
              c=float(r['directStationJulianDayUT']); d=float(r['postShadowEndJulianDayUT'])
              assert a < b < c < d, (r['body'], r['retrogradeStationUTC'])
              assert abs(float(r['preShadowStartDegree'])-float(r['directStationDegree'])) < 1e-9
              assert abs(float(r['postShadowEndDegree'])-float(r['retrogradeStationDegree'])) < 1e-9
          print(f'PASS topology rows={len(rows)}')
          PY

      - name: Upload manufactured table for audit
        uses: actions/upload-artifact@v4
        with:
          name: planetary-shadows-z21-z23
          if-no-files-found: error
          retention-days: 7
          path: |
            tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.json
            tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.csv
            /tmp/planetary-shadow-manufacture.txt
            /tmp/planetary-shadow-sha256.txt
            /tmp/planetary-shadow-bytes.txt

      - name: Freeze verified table on staging branch
        run: |
          mkdir -p /tmp/planetary-shadow-freeze
          cp tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.json /tmp/planetary-shadow-freeze/
          cp tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.csv /tmp/planetary-shadow-freeze/
          cat > /tmp/planetary-shadow-freeze/planetary-shadows-z21-z23.manifest.json <<'JSON'
          {
            "artifactFamily": "Orbo planetary retrograde shadow table Z21-Z23",
            "rows": 6691,
            "astronomicalSource": "Swiss Ephemeris DE441",
            "astronomicalSourceVersion": "2.10.03",
            "swissRepository": "huntarfischer/swisseph",
            "swissCommit": "3fd0f956d73898b91cc4f67cf18b21af656d1342",
            "spanStartUTC": "1577-05-05T05:46:50.976Z",
            "spanEndUTC": "2311-06-10T14:16:12.881Z",
            "inclusionLaw": "include every complete retrograde-shadow episode whose [pre-shadow start, post-shadow end] intersects the half-open Z21-Z24 ownership span",
            "shadowLaw": "pre-shadow begins at the first direct crossing of the later direct-station degree; retrograde begins at the retrograde station; direct motion resumes at the direct station; post-shadow ends at the next direct crossing of the earlier retrograde-station degree",
            "bodies": ["Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Pluto"],
            "trueNodePolicy": "excluded pending separate motion-topology decision",
            "counts": {"Mercury":2315,"Venus":460,"Mars":344,"Jupiter":673,"Saturn":710,"Uranus":726,"Neptune":731,"Pluto":732},
            "jsonBytes": 4792614,
            "jsonSha256": "e834b139e4a01650d59e33d54667dfd0c50d790bcb4a46db0c00a6a6ee59fa09",
            "csvBytes": 1754184,
            "csvSha256": "efe37424e8479f4e5ef6339342bfd9452ddfdf0af6e815baf5f5c6d6d9552457",
            "topologyAudit": "PASS 6691/6691"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/p22-duplicate-cleanup-staging
          git checkout -B freeze-planetary-shadows origin/agent/p22-duplicate-cleanup-staging
          mkdir -p tools/pass5/planetary-shadow-data
          cp /tmp/planetary-shadow-freeze/* tools/pass5/planetary-shadow-data/
          git add tools/pass5/planetary-shadow-data
          git commit -m "freeze canonical Z21-Z23 planetary shadow table"
          git push origin HEAD:agent/p22-duplicate-cleanup-staging
