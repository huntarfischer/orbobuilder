name: Pass 5 P22 Mundane Timespine Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/timespine-celestial-time-build
      - agent/p22-duplicate-cleanup-staging
    paths:
      - ".github/workflows/pass5-p22-verification.yml"
      - "tools/pass5/p22-data/**"
      - "tools/pass5/p22-results/**"
      - "tools/pass5/audit_p22_canonical_duplicates.py"
      - "tools/pass5/verify_p22_substrate.py"
      - "tools/pass5/record_p22_verification.py"
      - "tools/pass5/record_p22_cleanup_verification.py"
      - "native/OrboCore/Package.swift"
      - "native/OrboCore/Sources/OrboCore/Dioscuri/**"
      - "native/OrboCore/Sources/OrboCore/Forge/**"
      - "native/OrboCore/Sources/OrboCore/MundaneTimespine/**"
      - "native/OrboCore/Tests/OrboCoreTests/**"
      - "native/OrboLab/OrboLabApp.swift"

permissions:
  contents: write

jobs:
  repository-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Verify committed P22 substrate directly
        run: python3 tools/pass5/verify_p22_substrate.py

      - name: Audit all 17 canonical inputs for duplicate emissions
        run: python3 tools/pass5/audit_p22_canonical_duplicates.py

  native-proof:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Run accumulated OrboCore tests on Apple Swift
        run: swift test --package-path native/OrboCore

      - name: Build OrboCore on Apple Swift
        run: swift build --package-path native/OrboCore

      - name: Build OrboLab against live OrboCore
        run: |
          xcodebuild \
            -project native/Orbo.xcodeproj \
            -scheme OrboLab \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  record-proof:
    if: always()
    needs:
      - repository-substrate
      - native-proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Record ordinary P22 verification result
        if: github.ref_name != 'agent/p22-duplicate-cleanup-staging'
        env:
          SUBSTRATE_RESULT: ${{ needs.repository-substrate.result }}
          NATIVE_RESULT: ${{ needs.native-proof.result }}
        run: |
          python3 tools/pass5/record_p22_verification.py \
            --substrate-result "$SUBSTRATE_RESULT" \
            --native-result "$NATIVE_RESULT" \
            --source-commit "$GITHUB_SHA"

      - name: Record P22 cleanup verification result
        if: github.ref_name == 'agent/p22-duplicate-cleanup-staging'
        env:
          SUBSTRATE_RESULT: ${{ needs.repository-substrate.result }}
          NATIVE_RESULT: ${{ needs.native-proof.result }}
        run: |
          python3 tools/pass5/record_p22_cleanup_verification.py \
            --substrate-result "$SUBSTRATE_RESULT" \
            --native-result "$NATIVE_RESULT" \
            --source-commit "$GITHUB_SHA"

      - name: Persist proof result on learning branch
        if: github.ref_name == 'agent/timespine-celestial-time-build'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pass5/p22-verification-status.json specs/Native\ Port\ Manifest.md
          if ! git diff --cached --quiet; then
            git commit -m "record Pass 5 P22 verification result"
            git push origin HEAD:agent/timespine-celestial-time-build
          fi

      - name: Persist cleanup proof on staging branch
        if: github.ref_name == 'agent/p22-duplicate-cleanup-staging'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pass5/p22-verification-status.json
          if ! git diff --cached --quiet; then
            git commit -m "record P22 duplicate-cleanup verification"
            git push origin HEAD:agent/p22-duplicate-cleanup-staging
          fi
