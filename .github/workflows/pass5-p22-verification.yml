name: Pass 5 P22 Mundane Timespine Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/timespine-celestial-time-build
    paths:
      - ".github/workflows/pass5-p22-verification.yml"
      - "tools/pass5/p22-data/**"
      - "tools/pass5/p22-results/**"
      - "tools/pass5/verify_p22_substrate.py"
      - "native/OrboCore/Package.swift"
      - "native/OrboCore/Sources/OrboCore/MundaneTimespine/**"
      - "native/OrboCore/Tests/OrboCoreTests/MundaneTimespineTests.swift"
      - "native/OrboLab/OrboLabApp.swift"

permissions:
  contents: write

jobs:
  repository-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Verify committed P22 substrate directly
        run: python3 tools/pass5/verify_p22_substrate.py

  native-proof:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Run accumulated OrboCore tests on Apple Swift
        run: swift test --package-path native/OrboCore

      - name: Build OrboCore on Apple Swift
        run: swift build --package-path native/OrboCore

      - name: Build OrboLab against live OrboCore
        run: |
          xcodebuild \
            -project native/Orbo.xcodeproj \
            -scheme OrboLab \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  record-proof:
    if: always()
    needs:
      - repository-substrate
      - native-proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Record verification result and earned manifest status
        env:
          SUBSTRATE_RESULT: ${{ needs.repository-substrate.result }}
          NATIVE_RESULT: ${{ needs.native-proof.result }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          result = {
              "sourceCommit": os.environ["GITHUB_SHA"],
              "repositorySubstrate": os.environ["SUBSTRATE_RESULT"],
              "nativeProof": os.environ["NATIVE_RESULT"],
          }
          success = result["repositorySubstrate"] == "success" and result["nativeProof"] == "success"
          result["status"] = "success" if success else "failure"

          status_path = Path("tools/pass5/p22-verification-status.json")
          status_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          if success:
              manifest_path = Path("specs/Native Port Manifest.md")
              text = manifest_path.read_text(encoding="utf-8")
              text = text.replace("**Last updated:** 2026-08-16", "**Last updated:** 2026-08-17", 1)
              old_row = "| Mundane Timespine | PENDING | PENDING | OrboCore / MundaneTimespine | PASS 5 READY |"
              new_row = "| Mundane Timespine | REPRODUCE | STRUCTURAL | OrboCore / MundaneTimespine | P22 BODY SUBSTRATE PROVEN / RUNTIME READER PENDING |"
              if old_row in text:
                  text = text.replace(old_row, new_row, 1)
              elif new_row not in text:
                  raise SystemExit("Mundane Timespine ledger row is not in an expected state")

              marker = "# Pass 5 Component: Mundane Timespine (P22)"
              if marker not in text:
                  text += """

---

