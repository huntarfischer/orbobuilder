name: Pass 5 Mundane Timespine Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass5-timespine-qualification.yml"
      - "tools/pass5/**"
      - "native/OrboCore/Package.swift"
      - "native/OrboCore/Sources/OrboForgeTool/**"
      - "native/OrboCore/Sources/OrboCore/Forge/MundaneTimespineForge.swift"
      - "native/OrboCore/Sources/OrboCore/MundaneTimespine/**"
      - "native/OrboCore/Tests/OrboCoreTests/MundaneTimespineTests.swift"
      - "native/OrboCore/Tests/OrboCoreTests/Fixtures/Golden/mundane-timespine-candidate-v1.json"

permissions:
  contents: read

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pinned official Swiss C library
        run: |
          mkdir -p .forge/swisseph
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.so
          test -f .forge/swisseph/libswe.so
          git -C .forge/swisseph rev-parse HEAD

      - name: Fetch pinned qualified Swiss DE441 files
        run: |
          mkdir -p .forge/ephe
          base="https://raw.githubusercontent.com/aloistr/swisseph/$SWISS_COMMIT/ephe"
          for file in sepl_12.se1 semo_12.se1 sepl_18.se1 semo_18.se1; do
            curl --fail --location --retry 4 --retry-all-errors \
              "$base/$file" \
              --output ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done
          sha256sum .forge/ephe/*.se1 | sort

      - name: Generate deterministic Swiss C stamped-knot stream
        run: |
          python tools/pass5/generate_swiss_samples.py \
            --library .forge/swisseph/libswe.so \
            --ephe-dir .forge/ephe \
            --fixture native/OrboCore/Tests/OrboCoreTests/Fixtures/Golden/mundane-timespine-candidate-v1.json \
            --output .forge/swiss-samples.bin \
            --provenance-output .forge/swiss-provenance.json

      - name: Build Mundane Timespine body artifacts with native Forge
        run: |
          swift run \
            --package-path native/OrboCore \
            -c release \
            OrboForgeTool \
            --samples "$PWD/.forge/swiss-samples.bin" \
            --output-dir "$PWD/.forge/mundane-timespine-v1" \
            --version "v1" \
            --source "Swiss Ephemeris" \
            --source-version "2.10.03 C / DE441 se1 2026 / $SWISS_COMMIT" \
            --start-jd "2341972.5" \
            --end-jd "2506331.5"

      - name: Audit body artifacts independently against official Swiss C
        id: audit
        continue-on-error: true
        run: |
          python tools/pass5/audit_timespine.py \
            --library .forge/swisseph/libswe.so \
            --ephe-dir .forge/ephe \
            --artifact-dir .forge/mundane-timespine-v1 \
            --provenance .forge/swiss-provenance.json \
            --report .forge/mundane-timespine-v1-qualification.json

      - name: Build native package on qualification runner
        if: always()
        run: swift build --package-path native/OrboCore

      - name: Upload Pass 5 qualification products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass5-timespine-qualification
          if-no-files-found: warn
          retention-days: 14
          path: |
            .forge/mundane-timespine-v1/
            .forge/mundane-timespine-v1-qualification.json
            .forge/swiss-provenance.json

      - name: Enforce astronomical qualification gate
        if: steps.audit.outcome != 'success'
        run: |
          echo "The stamped Timespine candidate did not satisfy the official Swiss C fidelity gate."
          exit 1

  native-tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Run accumulated OrboCore tests on Apple Swift
        run: swift test --package-path native/OrboCore
