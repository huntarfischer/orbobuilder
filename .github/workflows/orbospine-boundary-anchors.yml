name: OrboSpine Bone Boundary Anchors

on:
  push:
    branches:
      - feature/orbospine-forge-gather

permissions:
  contents: write

jobs:
  forge-boundary-anchors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Build exact Swiss 2.10.03 source
        run: |
          git clone https://github.com/aloistr/swisseph.git /tmp/swisseph
          cd /tmp/swisseph
          git checkout 3fd0f956d73898b91cc4f67cf18b21af656d1342
          make libswe.a

      - name: Fetch and verify the exact C4 DE441 files needed at the Bone edges
        run: |
          mkdir -p /tmp/orbo-ephe
          cd /tmp/orbo-ephe
          for f in sepl_12.se1 sepl_18.se1 semo_12.se1 semo_18.se1; do
            curl -L --fail --silent --show-error -o "$f" "https://raw.githubusercontent.com/aloistr/swisseph/master/ephe/$f"
          done
          echo "8dccace2557601a223d5f8a7cf64de4e6bbb8a82b9b130b95a54d49adfbe546d  sepl_12.se1" > expected.sha256
          echo "ca1393ceab3a44fbc895887cf789c68819ae6a1cbc9b22225872dbe4ccd99a66  sepl_18.se1" >> expected.sha256
          echo "1c65fdbb854f350d3de36afc3e4ac126a53f360ae4f6dcb57beed7c690e7eb61  semo_12.se1" >> expected.sha256
          echo "1ca07bd67c24374d77226180c20a4f9996cba013697894810518e7eb582ca4f7  semo_18.se1" >> expected.sha256
          sha256sum -c expected.sha256

      - name: Forge the 22 exact Bone anchors
        run: |
          cat >/tmp/orbospine_boundary_anchors.c <<'EOF'
          #include <math.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include "swephexp.h"

          typedef struct {
            const char *name;
            int id;
          } Body;

          typedef struct {
            const char *label;
            double jd;
            const char *utc;
          } Boundary;

          int main(void) {
            const Body bodies[] = {
              {"Sun", SE_SUN},
              {"Moon", SE_MOON},
              {"Mercury", SE_MERCURY},
              {"Venus", SE_VENUS},
              {"Mars", SE_MARS},
              {"Jupiter", SE_JUPITER},
              {"Saturn", SE_SATURN},
              {"Uranus", SE_URANUS},
              {"Neptune", SE_NEPTUNE},
              {"Pluto", SE_PLUTO},
              {"True North Node", SE_TRUE_NODE},
            };
            const Boundary boundaries[] = {
              {"z21_start", 2297171.740867775, "1577-05-05T05:46:50.976Z"},
              {"z23_end_exclusive", 2565295.0945935287, "2311-06-10T14:16:12.881Z"},
            };
            const int flags = SEFLG_SWIEPH | SEFLG_SPEED;
            char serr[AS_MAXCH];
            double xx[6];

            swe_set_ephe_path("/tmp/orbo-ephe");
            puts("body,boundary,jd_ut,utc,physical_degree,longitudinal_speed_degrees_per_day,motion,directional_degree,navigation_cell");

            for (size_t b = 0; b < sizeof(bodies) / sizeof(bodies[0]); b++) {
              for (size_t e = 0; e < sizeof(boundaries) / sizeof(boundaries[0]); e++) {
                serr[0] = '\0';
                int ret = swe_calc_ut(boundaries[e].jd, bodies[b].id, flags, xx, serr);
                if (ret < 0 || !(ret & SEFLG_SWIEPH) || (ret & SEFLG_MOSEPH)) {
                  fprintf(stderr, "Swiss/DE441 gate failed for %s %s: ret=%d %s\n",
                          bodies[b].name, boundaries[e].label, ret, serr);
                  return 2;
                }
                double physical = fmod(xx[0], 360.0);
                if (physical < 0) physical += 360.0;
                const char *motion = xx[3] < 0.0 ? "retrograde" : "direct";
                double directional = xx[3] < 0.0 ? 360.0 + physical : physical;
                int cell = (int) floor(directional);
                printf("%s,%s,%.15f,%s,%.15f,%.15f,%s,%.15f,%d\n",
                       bodies[b].name,
                       boundaries[e].label,
                       boundaries[e].jd,
                       boundaries[e].utc,
                       physical,
                       xx[3],
                       motion,
                       directional,
                       cell);
              }
            }
            swe_close();
            return 0;
          }
          EOF

          cc -O2 -I/tmp/swisseph \
            /tmp/orbospine_boundary_anchors.c \
            /tmp/swisseph/libswe.a -lm \
            -o /tmp/orbospine_boundary_anchors

          /tmp/orbospine_boundary_anchors \
            > tools/pass5/orbospine-build/celestial/orbospine-boundary-anchors.csv

          test "$(wc -l < tools/pass5/orbospine-build/celestial/orbospine-boundary-anchors.csv)" -eq 23

      - name: Cross-check Pluto against the Bone's Zeitgeist fences
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p = Path('tools/pass5/orbospine-build/celestial/orbospine-boundary-anchors.csv')
          rows = list(csv.DictReader(p.open()))
          pluto = [r for r in rows if r['body'] == 'Pluto']
          assert len(pluto) == 2
          for r in pluto:
              degree = float(r['physical_degree'])
              distance = min(abs(degree), abs(360.0-degree))
              assert distance <= 0.0001, (r['boundary'], degree)
              assert r['motion'] == 'direct', r
          print('PASS Pluto Bone-fence cross-check: 2 / 2')
          PY

      - name: Preserve on Hephaestus's bench
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/pass5/orbospine-build/celestial/orbospine-boundary-anchors.csv
          git commit -m "Forge exact OrboSpine Bone boundary anchors [skip ci]"
          git push origin HEAD:feature/orbospine-forge-gather
