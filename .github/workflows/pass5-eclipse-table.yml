name: Pass 5 P22 Eclipse Table

on:
  workflow_dispatch:
  push:
    branches:
      - agent/timespine-celestial-time-build
    paths:
      - tools/pass5/eclipse-forge/main.swift
      - .github/workflows/pass5-eclipse-table.yml

permissions:
  contents: write

# Repository DE441 files are the ephemeris data source for this lane.
jobs:
  forge-p22-eclipses:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Orbo construction branch
        uses: actions/checkout@v4
        with:
          ref: agent/timespine-celestial-time-build
          fetch-depth: 0

      - name: Record eclipse Forge start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/pass5/p22-results
          printf '{\n  "workflowStatus": "started",\n  "sourceCommit": "%s"\n}\n' "$GITHUB_SHA" > tools/pass5/p22-results/eclipse-workflow-status.json
          git config user.name "Orbo Forge"
          git config user.email "orbo-forge@users.noreply.github.com"
          git add tools/pass5/p22-results/eclipse-workflow-status.json
          git commit -m "Record P22 eclipse Forge start [skip ci]"
          git push origin HEAD:agent/timespine-celestial-time-build

      - name: Verify Orbo's committed Swiss ephemeris files
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/pass5/sepl_18.se1
          test -f tools/pass5/semo_18.se1
          head -c 512 tools/pass5/sepl_18.se1 | strings | grep -q DE441
          head -c 512 tools/pass5/semo_18.se1 | strings | grep -q DE441

      - name: Build pinned Swiss computation engine
        shell: bash
        run: |
          set -euo pipefail
          SWISS="$RUNNER_TEMP/swisseph"
          git clone https://github.com/aloistr/swisseph.git "$SWISS"
          cd "$SWISS"
          git checkout 3fd0f956d73898b91cc4f67cf18b21af656d1342
          test "$(git rev-parse HEAD)" = "3fd0f956d73898b91cc4f67cf18b21af656d1342"
          make libswe.dylib
          test -f libswe.dylib

      - name: Compile Swift eclipse Forge
        shell: bash
        run: |
          set -euo pipefail
          swiftc tools/pass5/eclipse-forge/main.swift -o "$RUNNER_TEMP/orbo-eclipse-forge"

      - name: Manufacture degree-oriented P22 eclipse table
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/orbo-eclipse-forge" \
            --library "$RUNNER_TEMP/swisseph/libswe.dylib" \
            --ephe "$GITHUB_WORKSPACE/tools/pass5" \
            --source-sha 3fd0f956d73898b91cc4f67cf18b21af656d1342 \
            --csv tools/pass5/p22-data/eclipse-table.csv \
            --summary tools/pass5/p22-data/eclipse-table-summary.json
          test -s tools/pass5/p22-data/eclipse-table.csv
          test -s tools/pass5/p22-data/eclipse-table-summary.json
          grep -q 'Swiss Ephemeris DE441 repository files' tools/pass5/p22-data/eclipse-table-summary.json

      - name: Preserve generated eclipse artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p22-eclipse-table
          path: |
            tools/pass5/p22-data/eclipse-table.csv
            tools/pass5/p22-data/eclipse-table-summary.json

      - name: Commit manufactured table to construction branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Orbo Forge"
          git config user.email "orbo-forge@users.noreply.github.com"
          git pull --rebase origin agent/timespine-celestial-time-build
          git add tools/pass5/p22-data/eclipse-table.csv tools/pass5/p22-data/eclipse-table-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Forge P22 eclipse table [skip ci]"
            git push origin HEAD:agent/timespine-celestial-time-build
          fi

      - name: Record eclipse Forge result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin agent/timespine-celestial-time-build
          mkdir -p tools/pass5/p22-results
          printf '{\n  "workflowStatus": "%s",\n  "sourceCommit": "%s"\n}\n' "${{ job.status }}" "$GITHUB_SHA" > tools/pass5/p22-results/eclipse-workflow-status.json
          git config user.name "Orbo Forge"
          git config user.email "orbo-forge@users.noreply.github.com"
          git add tools/pass5/p22-results/eclipse-workflow-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record P22 eclipse Forge result [skip ci]"
            git push origin HEAD:agent/timespine-celestial-time-build
          fi
