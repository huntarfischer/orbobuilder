name: Pass 5 Z21 Z23 Body Occurrences

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/p22-duplicate-cleanup-staging
    paths:
      - ".github/workflows/pass5-z21-z23-body-occurrences.yml"

permissions:
  contents: write

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  manufacture-body-occurrences:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Build pinned Swiss C library from Huntarfischer fork
        run: |
          mkdir -p .forge/swisseph .forge/ephe
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/huntarfischer/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.so
          test -f .forge/swisseph/libswe.so

      - name: Fetch pinned DE441 files from Huntarfischer fork
        run: |
          base="https://raw.githubusercontent.com/huntarfischer/swisseph/$SWISS_COMMIT/ephe"
          files=(
            sepl_12.se1 sepl_18.se1 sepl_24.se1
            semo_12.se1 semo_18.se1 semo_24.se1
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 4 --retry-all-errors \
              "$base/$file" --output ".forge/ephe/$file"
            test -s ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done

      - name: Build Z21 and Z23 variants of proven Swift manufacturer
        run: |
          cp tools/pass5/P22TimespinePOC.swift /tmp/Z21TimespinePOC.swift
          cp tools/pass5/P22TimespinePOC.swift /tmp/Z23TimespinePOC.swift
          python3 - <<'PY'
          from pathlib import Path
          variants = {
              '/tmp/Z21TimespinePOC.swift': ('2297171.740867775','2386637.0793997087'),
              '/tmp/Z23TimespinePOC.swift': ('2475819.1417904533','2565295.0945935287'),
          }
          for path,(start,end) in variants.items():
              p=Path(path); s=p.read_text()
              s=s.replace('let p22StartJD = 2386637.079399706', f'let p22StartJD = {start}')
              s=s.replace('let p23StartJD = 2475819.1417904524', f'let p23StartJD = {end}')
              p.write_text(s)
          PY
          swiftc -O /tmp/Z21TimespinePOC.swift -o /tmp/z21-forge
          swiftc -O /tmp/Z23TimespinePOC.swift -o /tmp/z23-forge

      - name: Manufacture celestial-first Z21 and Z23 body tables
        run: |
          rm -rf /tmp/z21-raw /tmp/z23-raw tools/pass5/zeitgeist-body-data
          mkdir -p /tmp/z21-raw /tmp/z23-raw tools/pass5/zeitgeist-body-data/z21 tools/pass5/zeitgeist-body-data/z23
          /tmp/z21-forge \
            --library "$PWD/.forge/swisseph/libswe.so" \
            --ephe-dir "$PWD/.forge/ephe" \
            --output-dir /tmp/z21-raw \
            | tee /tmp/z21-body-manufacture.txt
          /tmp/z23-forge \
            --library "$PWD/.forge/swisseph/libswe.so" \
            --ephe-dir "$PWD/.forge/ephe" \
            --output-dir /tmp/z23-raw \
            | tee /tmp/z23-body-manufacture.txt
          mkdir -p tools/pass5/zeitgeist-body-data/z21/body-tables tools/pass5/zeitgeist-body-data/z23/body-tables
          for z in z21 z23; do
            raw="/tmp/${z}-raw/body-tables"
            dst="tools/pass5/zeitgeist-body-data/${z}/body-tables"
            for f in "$raw"/*.csv; do gzip -6 -c "$f" > "$dst/$(basename "$f").gz"; done
            test "$(find "$dst" -name '*.csv.gz' | wc -l)" -eq 11
          done

      - name: Build canonical Zeitgeist manifests
        run: |
          python3 - <<'PY'
          import csv,gzip,hashlib,json,glob,os
          root='tools/pass5/zeitgeist-body-data'
          spans={
            'z21':('Z21',2297171.740867775,2386637.0793997087,'1577-05-05T05:46:50.976Z','1822-04-16T13:54:20.135Z'),
            'z23':('Z23',2475819.1417904533,2565295.0945935287,'2066-06-17T15:24:10.695Z','2311-06-10T14:16:12.881Z'),
          }
          manifests={}
          for key,(zid,start,end,sutc,eutc) in spans.items():
              files=[]; total=0; bodies=[]
              for p in sorted(glob.glob(f'{root}/{key}/body-tables/*.csv.gz')):
                  h=hashlib.sha256(open(p,'rb').read()).hexdigest(); n=0
                  with gzip.open(p,'rt',newline='') as f:
                      r=csv.DictReader(f)
                      res=None; markers=[]
                      for row in r:
                          if res is None:
                              res=float(row['celestialResolutionDegrees'])
                              markers=[c[:-6] for c in r.fieldnames if c.endswith('Degree') and c not in ('focalCelestialDegrees','celestialResolutionDegrees')]
                          n+=1
                  body=os.path.basename(p).replace('.csv.gz',''); total+=n
                  files.append({'path':f'body-tables/{body}.csv.gz','bytes':os.path.getsize(p),'sha256':h})
                  bodies.append({'body':body,'selectedRecords':n,'selectedResolutionDegrees':res,'selectedMarkers':markers})
              manifest={
                'zeitgeist':zid,
                'spanLaw':'half-open owner interval [first Pluto direct Aries ingress, next Zeitgeist first Pluto direct Aries ingress)',
                'celestialLaw':'body zodiacal position is primary celestial time; civic UT identifies occurrence only',
                'startJulianDayUT':start,'startUTC':sutc,'endJulianDayUT':end,'endUTC':eutc,
                'astronomicalSource':'Swiss Ephemeris DE441; geocentric tropical apparent ecliptic longitude; UT',
                'swissVersion':'2.10.03','bodyTableCount':11,'totalSelectedRecords':total,
                'resolutionLaw':'1 degree Sun through Mars; 0.1 degree Jupiter, Saturn, Uranus, Neptune, Pluto, True North Node',
                'nodeRepresentation':'True North Node; South Node derived at +180 degrees',
                'bodyTables':bodies,'files':files,
              }
              with open(f'{root}/{key}/manifest.json','w') as f: json.dump(manifest,f,indent=2,sort_keys=True); f.write('\n')
              manifests[zid]=manifest
          with open(f'{root}/manifest.json','w') as f:
              json.dump({'artifactFamily':'Orbo Z21/Z23 celestial-first body occurrence tables','swissRepository':'huntarfischer/swisseph','swissCommit':'3fd0f956d73898b91cc4f67cf18b21af656d1342','zeitgeists':manifests},f,indent=2,sort_keys=True); f.write('\n')
          print('Z21 records',manifests['Z21']['totalSelectedRecords'])
          print('Z23 records',manifests['Z23']['totalSelectedRecords'])
          PY

      - name: Audit celestial ownership bounds and recurrence identity
        run: |
          python3 - <<'PY'
          import csv,gzip,json,glob
          root='tools/pass5/zeitgeist-body-data'
          for zid in ('z21','z23'):
              m=json.load(open(f'{root}/{zid}/manifest.json')); start,end=m['startJulianDayUT'],m['endJulianDayUT']
              assert m['bodyTableCount']==11
              for p in glob.glob(f'{root}/{zid}/body-tables/*.csv.gz'):
                  with gzip.open(p,'rt',newline='') as f:
                      rows=csv.DictReader(f); counts={}; n=0
                      for r in rows:
                          jd=float(r['utJulianDay']); tick=int(r['focalCelestialTick']); occ=int(r['occurrence'])
                          assert start-1e-9 <= jd < end-1e-9, (p,jd,start,end)
                          counts[tick]=counts.get(tick,0)+1
                          assert occ==counts[tick], (p,tick,occ,counts[tick])
                          n+=1
                      assert n>0,p
          print('PASS celestial bounds + recurrence occurrence audit')
          PY

      - name: Record artifact hashes
        run: |
          find tools/pass5/zeitgeist-body-data -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/z-body-sha256.txt
          du -sh tools/pass5/zeitgeist-body-data
          cat /tmp/z-body-sha256.txt

      - name: Upload manufactured tables for audit
        uses: actions/upload-artifact@v4
        with:
          name: z21-z23-body-occurrences
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            tools/pass5/zeitgeist-body-data/
            /tmp/z21-body-manufacture.txt
            /tmp/z23-body-manufacture.txt
            /tmp/z-body-sha256.txt

      - name: Freeze verified tables on staging branch
        if: success()
        run: |
          rm -rf /tmp/zeitgeist-body-data
          cp -R tools/pass5/zeitgeist-body-data /tmp/zeitgeist-body-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/p22-duplicate-cleanup-staging
          git checkout -B freeze-body-data origin/agent/p22-duplicate-cleanup-staging
          rm -rf tools/pass5/zeitgeist-body-data
          mkdir -p tools/pass5
          cp -R /tmp/zeitgeist-body-data tools/pass5/zeitgeist-body-data
          git add tools/pass5/zeitgeist-body-data
          git commit -m "freeze Z21 Z23 celestial body occurrence tables"
          git push origin HEAD:agent/p22-duplicate-cleanup-staging
