name: Pass 5 Z23 Motion Tables

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/p22-duplicate-cleanup-staging
    paths:
      - ".github/workflows/pass5-z23-motion.yml"

permissions:
  contents: write

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342
  Z23_START_JD: 2475819.1417904533
  Z24_START_JD: 2565295.0945935287

jobs:
  manufacture-z23-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Build pinned Swiss C library from Huntarfischer fork
        run: |
          mkdir -p .forge/swisseph .forge/ephe
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/huntarfischer/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.so
          test -f .forge/swisseph/libswe.so

      - name: Fetch pinned DE441 files from Huntarfischer fork
        run: |
          base="https://raw.githubusercontent.com/huntarfischer/swisseph/$SWISS_COMMIT/ephe"
          files=(sepl_18.se1 sepl_24.se1 semo_18.se1 semo_24.se1)
          for file in "${files[@]}"; do
            curl --fail --location --retry 4 --retry-all-errors "$base/$file" --output ".forge/ephe/$file"
            test -s ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done

      - name: Prepare proven Z22 manufacturer for Z23 owner bounds
        run: |
          cp tools/pass5/P22TimespinePOC.swift /tmp/Z23TimespinePOC.swift
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/Z23TimespinePOC.swift')
          s=p.read_text()
          old_a='let p22StartJD = 2386637.079399706'
          old_b='let p23StartJD = 2475819.1417904524'
          assert old_a in s and old_b in s
          s=s.replace(old_a, 'let p22StartJD = 2475819.1417904533', 1)
          s=s.replace(old_b, 'let p23StartJD = 2565295.0945935287', 1)
          p.write_text(s)
          PY

      - name: Manufacture Z23 motion substrate
        run: |
          rm -rf /tmp/z23-motion-build /tmp/z23-motion-frozen
          mkdir -p /tmp/z23-motion-build /tmp/z23-motion-frozen
          swift /tmp/Z23TimespinePOC.swift \
            --library "$PWD/.forge/swisseph/libswe.so" \
            --ephe-dir "$PWD/.forge/ephe" \
            --output-dir /tmp/z23-motion-build \
            | tee /tmp/z23-motion-manufacture.txt
          test -s /tmp/z23-motion-build/station-table.csv
          test -s /tmp/z23-motion-build/retrograde-passages.csv
          cp /tmp/z23-motion-build/station-table.csv /tmp/z23-motion-frozen/station-table.csv
          cp /tmp/z23-motion-build/retrograde-passages.csv /tmp/z23-motion-frozen/retrograde-passages.csv

      - name: Audit Z23 motion tables and shadow agreement
        run: |
          python3 - <<'PY'
          import csv, os, re, json, hashlib
          start=float(os.environ['Z23_START_JD']); end=float(os.environ['Z24_START_JD'])
          station='/tmp/z23-motion-frozen/station-table.csv'
          retro='/tmp/z23-motion-frozen/retrograde-passages.csv'
          shadow='tools/pass5/planetary-shadow-data/planetary-shadows-z21-z23.csv'

          with open(station,newline='') as f:
              sr=list(csv.DictReader(f)); sh=f'{len(sr)}'
          with open(retro,newline='') as f:
              rr=list(csv.DictReader(f))
          assert sr and rr
          for r in sr:
              jd=float(r['utJulianDay']); assert start-1e-9 <= jd < end+1e-9
          for r in rr:
              a=float(r['startJulianDay']); b=float(r['endJulianDay'])
              assert start-1e-9 <= a < b <= end+1e-9
              assert r['userFacingMotion']=='retrograde'

          def norm(s): return re.sub(r'[^a-z0-9]','',s.lower())
          with open(shadow,newline='') as f:
              dr=csv.DictReader(f); headers=dr.fieldnames or []; shadows=list(dr)
          hm={norm(h):h for h in headers}
          def pick(*cands):
              for c in cands:
                  if norm(c) in hm: return hm[norm(c)]
              raise AssertionError((cands,headers))
          bodyc=pick('body')
          rc=pick('retrograde_station_jd_ut','retrogradeStationJDUT','retrogradeStationJulianDayUT','retrograde_station_jd')
          dc=pick('direct_station_jd_ut','directStationJDUT','directStationJulianDayUT','direct_station_jd')
          wanted={'Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto'}
          index={b:[] for b in wanted}
          for s in shadows:
              b=s[bodyc]
              if b in wanted:
                  index[b].append((float(s[rc]),float(s[dc])))
          compared=0
          maxerr=0.0
          for r in rr:
              b=r['body']
              if b not in wanted: continue
              a=float(r['startJulianDay']); d=float(r['endJulianDay'])
              # Only full station-to-station passages are expected to equal a shadow episode exactly.
              if abs(a-start)<1e-8 or abs(d-end)<1e-8: continue
              candidates=index[b]
              assert candidates, b
              best=min(candidates,key=lambda x:abs(x[0]-a)+abs(x[1]-d))
              e=max(abs(best[0]-a),abs(best[1]-d))*86400.0
              maxerr=max(maxerr,e)
              assert e <= 1.0,(b,a,d,best,e)
              compared+=1
          assert compared>0
          manifest={
            'zeitgeist':'Z23',
            'artifactFamily':'Orbo motion tables',
            'ownershipLaw':'Z23 first Pluto Aries ingress inclusive to Z24 first Pluto Aries ingress exclusive',
            'startJulianDayUT':start,
            'startUTC':'2066-06-17T15:24:10.695Z',
            'endJulianDayUT':end,
            'endUTC':'2311-06-10T14:16:12.881Z',
            'astronomicalSource':'Swiss Ephemeris DE441; geocentric tropical apparent ecliptic longitude and speed; UT',
            'swissVersion':'2.10.03',
            'swissRepository':'huntarfischer/swisseph',
            'swissCommit':os.environ['SWISS_COMMIT'],
            'stationRows':len(sr),
            'retrogradePassageRows':len(rr),
            'shadowCrossCheckBodies':sorted(wanted),
            'shadowCrossCheckCompletePassages':compared,
            'shadowCrossCheckMaxErrorSeconds':maxerr,
            'shadowCrossCheckLaw':'Mercury through Pluto complete retrograde passages equal retrograde-station to direct-station intervals in the frozen planetary shadow table; boundary-clipped passages excluded',
            'files':[]
          }
          for p in (station,retro):
              data=open(p,'rb').read()
              manifest['files'].append({'path':os.path.basename(p),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          with open('/tmp/z23-motion-frozen/manifest.json','w') as f: json.dump(manifest,f,indent=2,sort_keys=True); f.write('\n')
          print('PASS Z23 motion + shadow agreement')
          print(json.dumps({'stations':len(sr),'retrogradePassages':len(rr),'shadowCompared':compared,'maxErrorSeconds':maxerr},sort_keys=True))
          PY
          sha256sum /tmp/z23-motion-frozen/* | tee /tmp/z23-motion-sha256.txt

      - name: Upload Z23 motion artifact
        uses: actions/upload-artifact@v4
        with:
          name: z23-motion-tables
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            /tmp/z23-motion-frozen/
            /tmp/z23-motion-manufacture.txt
            /tmp/z23-motion-sha256.txt

      - name: Freeze verified Z23 motion tables on staging branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/p22-duplicate-cleanup-staging
          git checkout -B freeze-z23-motion origin/agent/p22-duplicate-cleanup-staging
          rm -rf tools/pass5/zeitgeist-motion-data/z23
          mkdir -p tools/pass5/zeitgeist-motion-data
          cp -R /tmp/z23-motion-frozen tools/pass5/zeitgeist-motion-data/z23
          git add tools/pass5/zeitgeist-motion-data/z23
          git commit -m "freeze Z23 station and retrograde passage tables"
          git push origin HEAD:agent/p22-duplicate-cleanup-staging
