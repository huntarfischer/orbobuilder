name: True BML Station Diagnostics

on:
  push:
    branches: [forge/true-bml-qualification]
    paths:
      - ".github/workflows/truebml-station-diagnostics.yml"
      - "tools/pass5/diagnose_truebml_stations.py"

permissions:
  actions: read
  contents: read

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342
  QUALIFICATION_RUN_ID: 33480516038

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Download manufactured True BML qualification artifact
        uses: actions/download-artifact@v4
        with:
          name: truebml-qualification
          path: .forge/truebml
          github-token: ${{ github.token }}
          run-id: ${{ env.QUALIFICATION_RUN_ID }}

      - name: Build pinned Swiss C
        run: |
          mkdir -p .forge/swisseph
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.so
          test -f .forge/swisseph/libswe.so

      - name: Stage qualified DE441 main inputs
        run: |
          mkdir -p .forge/ephe
          base="https://raw.githubusercontent.com/aloistr/swisseph/$SWISS_COMMIT/ephe"
          for file in sepl_12.se1 sepl_18.se1 semo_12.se1 semo_18.se1 seas_12.se1 seas_18.se1; do
            curl --fail --location --retry 4 --retry-all-errors "$base/$file" --output ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done

      - name: Diagnose station persistence and extrema
        run: |
          python tools/pass5/diagnose_truebml_stations.py \
            --library .forge/swisseph/libswe.so \
            --ephe-dir .forge/ephe \
            --stations .forge/truebml/stations/TrueBML.csv.gz \
            --output-dir .forge/diagnostics

      - name: Upload station diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: truebml-station-diagnostics
          if-no-files-found: error
          retention-days: 14
          path: .forge/diagnostics/
