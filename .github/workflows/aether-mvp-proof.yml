name: Aether MVP Proof

on:
  push:
    branches:
      - feature/apollo-artemis-mvp

jobs:
  orbocore-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner-only test copy
        run: |
          cp -R native/OrboCore "$RUNNER_TEMP/OrboCore"
          rm "$RUNNER_TEMP/OrboCore/Tests/OrboCoreTests/RingTests.swift"

      - name: Aether Pass A authority
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter AetherPassATests

      - name: Aether Pass B environmental matter
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter AetherPassBTests

      - name: Aether Pass C Orbo seam
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter AetherPassCTests

      - name: Aether Pass D headless MVP boundary
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter AetherPassDTests

      - name: Aether remains presentation-neutral
        run: |
          if grep -R -n -E '^import (SwiftUI|UIKit|AppKit|QuartzCore|Metal|RealityKit|Charts)$' "$RUNNER_TEMP/OrboCore/Sources/OrboCore/OrboSystem/Aether"; then
            echo "Aether must remain presentation-neutral."
            exit 1
          fi

      - name: OrboCore regression suite except known RingTests compiler blocker
        run: swift test --package-path "$RUNNER_TEMP/OrboCore"
