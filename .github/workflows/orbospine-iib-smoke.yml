name: OrboSpine II-B Smoke

on:
  push:
    branches:
      - feature/orbospine-shippable-iib-2026-09-03
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mount smoke proof
        working-directory: native/OrboCore
        run: swift test --filter OrboSpineArtifactRoundTripSmokeTests
