name: Door III Pass 2

on:
  push:
    branches:
      - feature/orbo-lawbook-2026-08-30
    paths:
      - 'native/OrboCore/**'
      - '.github/workflows/door-iii-pass2.yml'
  workflow_dispatch:

jobs:
  orbocore-tests:
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner-only test copy
        run: |
          cp -R native/OrboCore "$RUNNER_TEMP/OrboCore"
          rm "$RUNNER_TEMP/OrboCore/Tests/OrboCoreTests/RingTests.swift"

      - name: Door III point resolution
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter OrboSpineLinkResolutionTests

      - name: Existing Link and Hecate Link regressions
        run: |
          swift test --package-path "$RUNNER_TEMP/OrboCore" --filter SpineLinkTests
          swift test --package-path "$RUNNER_TEMP/OrboCore" --filter HecateLinkTests

      - name: OrboCore suite except known RingTests compiler blocker
        run: swift test --package-path "$RUNNER_TEMP/OrboCore"
