name: Agent P22 Inner Marker Pair Audit

on:
  push:
    branches:
      - agent/timespine-celestial-time-build
    paths:
      - "tools/pass5/audit_p22_inner_marker_pairs.py"
      - ".github/workflows/agent-p22-inner-marker-pairs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Swiss C
        run: |
          mkdir -p .forge/swisseph
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin 3fd0f956d73898b91cc4f67cf18b21af656d1342
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.dylib
      - name: Audit Mercury and Venus marker pairs
        run: |
          python3 tools/pass5/audit_p22_inner_marker_pairs.py \
            --library "$PWD/.forge/swisseph/libswe.dylib" \
            --ephe-dir "$PWD/tools/pass5" \
            --p22-dir "$PWD/tools/pass5/p22-data" \
            --output "$PWD/tools/pass5/p22-results/inner-marker-pairs.json"
      - name: Persist audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pass5/p22-results/inner-marker-pairs.json
          if ! git diff --cached --quiet; then
            git commit -m "record P22 inner marker pair audit"
            git push origin HEAD:agent/timespine-celestial-time-build
          fi
