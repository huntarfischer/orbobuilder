name: Natal Moirai Threads Repair

on:
  push:
    branches: [feature/natal-moirai-threads-repair-2026-09-06]
  pull_request:
    branches: [feature/natal-spine-act2-finished-artifact-2026-09-05]
  workflow_dispatch:

concurrency:
  group: natal-moirai-threads-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  act-gate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prove existing bounded-matter behavior
        run: swift test --package-path native/OrboCore --filter NatalSpineActIIBeat2SubstrateTests
      - name: Run OrboCore regression
        run: swift test --package-path native/OrboCore
