name: Orbo Preparation Proof

on:
  push:
    branches:
      - feature/apollo-artemis-mvp
      - orbo/8-30-26
      - agent/natal-spine-sequestered

concurrency:
  group: orbo-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orbocore-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner-only test copy
        run: |
          cp -R native/OrboCore "$RUNNER_TEMP/OrboCore"
          rm "$RUNNER_TEMP/OrboCore/Tests/OrboCoreTests/RingTests.swift"

      - name: Pythia Pass A authority
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter PythiaPassATests

      - name: Apollo Hermes Pass B face ownership
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter AstrolabeFaceOwnershipPassBTests

      - name: Natal Spine focused proof
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter NatalSpine

      - name: OrboCore regression suite except known RingTests compiler blocker
        run: swift test --package-path "$RUNNER_TEMP/OrboCore"
