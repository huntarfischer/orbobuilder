name: Agent P22 Timespine POC

on:
  push:
    branches:
      - agent/timespine-celestial-time-build
    paths:
      - "tools/pass5/P22TimespinePOC.swift"
      - ".github/workflows/agent-p22-timespine-poc.yml"
  workflow_dispatch:

concurrency:
  group: p22-timespine-learning
  cancel-in-progress: true

permissions:
  contents: write

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  build-p22:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Record P22 build start
        run: |
          mkdir -p tools/pass5/p22-results
          printf '{\n  "workflowStatus": "started",\n  "sourceCommit": "%s"\n}\n' "$GITHUB_SHA" > tools/pass5/p22-results/workflow-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pass5/p22-results/workflow-status.json
          git commit -m "record P22 Timespine POC start"
          git push origin HEAD:agent/timespine-celestial-time-build

      - name: Build pinned Swiss C
        run: |
          mkdir -p .forge/swisseph
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.dylib
          test -f .forge/swisseph/libswe.dylib

      - name: Fetch DE441 segments spanning P22
        run: |
          mkdir -p .forge/ephe
          base="https://raw.githubusercontent.com/aloistr/swisseph/$SWISS_COMMIT/ephe"
          for file in sepl_12.se1 semo_12.se1 sepl_18.se1 semo_18.se1; do
            curl --fail --location --retry 4 --retry-all-errors "$base/$file" --output ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done

      - name: Compile P22 harness
        run: |
          mkdir -p .forge
          swiftc -O tools/pass5/P22TimespinePOC.swift -o .forge/P22TimespinePOC

      - name: Build P22 eleven-body Timespine substrate
        run: |
          .forge/P22TimespinePOC \
            --library "$PWD/.forge/swisseph/libswe.dylib" \
            --ephe-dir "$PWD/.forge/ephe" \
            --output-dir "$PWD/.forge/p22-timespine"

      - name: Read P22 summary
        run: cat .forge/p22-timespine/summary.json

      - name: Measure generated table sizes
        run: |
          echo "body table CSV bytes"
          find .forge/p22-timespine/body-tables -name '*.csv' -print0 | xargs -0 stat -f '%z %N'
          echo "total body table CSV bytes"
          find .forge/p22-timespine/body-tables -name '*.csv' -print0 | xargs -0 stat -f '%z' | awk '{s+=$1} END {print s}'
          echo "station/retrograde table bytes"
          stat -f '%z %N' .forge/p22-timespine/station-table.csv .forge/p22-timespine/retrograde-passages.csv .forge/p22-timespine/retrograde-crossings.csv

      - name: Upload P22 Timespine specimen
        uses: actions/upload-artifact@v4
        with:
          name: p22-timespine-specimen
          path: |
            .forge/p22-timespine/summary.json
            .forge/p22-timespine/body-tables/*.csv
            .forge/p22-timespine/station-table.csv
            .forge/p22-timespine/retrograde-passages.csv
            .forge/p22-timespine/retrograde-crossings.csv
          if-no-files-found: error
          compression-level: 6

      - name: Stage persistent P22 dataset
        if: success()
        run: |
          rm -rf tools/pass5/p22-data
          mkdir -p tools/pass5/p22-data/body-tables
          cp .forge/p22-timespine/summary.json tools/pass5/p22-data/summary.json
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json, shutil

          src = Path('.forge/p22-timespine')
          dst = Path('tools/pass5/p22-data')
          sources = sorted((src / 'body-tables').glob('*.csv'))
          sources += [
              src / 'station-table.csv',
              src / 'retrograde-passages.csv',
              src / 'retrograde-crossings.csv',
          ]

          files = []
          for source in sources:
              if source.parent.name == 'body-tables':
                  target = dst / 'body-tables' / f'{source.name}.gz'
              else:
                  target = dst / f'{source.name}.gz'
              target.parent.mkdir(parents=True, exist_ok=True)
              with source.open('rb') as inp, target.open('wb') as raw:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=raw, compresslevel=9, mtime=0) as out:
                      shutil.copyfileobj(inp, out)
              payload = target.read_bytes()
              files.append({
                  'path': target.relative_to(dst).as_posix(),
                  'uncompressedBytes': source.stat().st_size,
                  'compressedBytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })

          manifest = {
              'span': 'P22 Pluto Zeitgeist',
              'format': 'gzip-compressed CSV learning substrate; summary JSON remains plain text',
              'bodyTableCount': 11,
              'sharedTables': ['station-table', 'retrograde-passages', 'retrograde-crossings'],
              'files': files,
              'compressedBytesTotal': sum(x['compressedBytes'] for x in files),
              'uncompressedBytesTotal': sum(x['uncompressedBytes'] for x in files),
          }
          (dst / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Persist P22 build result
        if: always()
        run: |
          mkdir -p tools/pass5/p22-results
          if test -f .forge/p22-timespine/summary.json; then
            cp .forge/p22-timespine/summary.json tools/pass5/p22-results/summary.json
          fi
          printf '{\n  "workflowStatus": "%s",\n  "sourceCommit": "%s"\n}\n' "${{ job.status }}" "$GITHUB_SHA" > tools/pass5/p22-results/workflow-status.json
          git add tools/pass5/p22-results
          if test -d tools/pass5/p22-data; then
            git add tools/pass5/p22-data
          fi
          if ! git diff --cached --quiet; then
            git commit -m "record persistent P22 Timespine dataset"
            git push origin HEAD:agent/timespine-celestial-time-build
          fi

# Learning branch only. No production OrboCore ownership implied.
