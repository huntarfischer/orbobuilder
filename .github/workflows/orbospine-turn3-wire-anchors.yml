name: OrboSpine Turn 3 Anchor Wiring

on:
  push:
    branches:
      - feature/orbospine-forge-gather

permissions:
  contents: write

jobs:
  wire-anchors:
    if: github.event.head_commit.message == 'Retry OrboSpine Turn 3 anchor wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow Turn 3 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one patch site, found {count}')
              return text.replace(old, new, 1)

          runtime_path = Path('native/OrboCore/Sources/OrboCore/OrboSystem/OrboSpine/OrboSpineRuntime.swift')
          runtime = runtime_path.read_text()
          runtime = replace_once(
              runtime,
              '        stations: [OrboSpineStation],\n',
              '        stations: [OrboSpineStation],\n        boundaryAnchors: [OrboSpineBoundaryAnchor] = [],\n',
              'runtime initializer'
          )
          runtime = replace_once(
              runtime,
              '              stations.allSatisfy({ canonicalBodies.contains($0.body) && bone.contains($0.julianDay) }),\n              retrogradePassages.allSatisfy({\n',
              '              stations.allSatisfy({ canonicalBodies.contains($0.body) && bone.contains($0.julianDay) }),\n              boundaryAnchors.allSatisfy({ canonicalBodies.contains($0.body) }),\n              retrogradePassages.allSatisfy({\n',
              'runtime anchor validation'
          )
          runtime = replace_once(
              runtime,
              '                  stations: stations,\n                  terraSamples: terraSamples\n',
              '                  stations: stations,\n                  boundaryAnchors: boundaryAnchors,\n                  terraSamples: terraSamples\n',
              'runtime Locate bridge'
          )
          runtime_path.write_text(runtime)

          cert_path = Path('native/OrboCore/Sources/OrboSpineDioscuriCertificationTool/main.swift')
          cert = cert_path.read_text()
          cert = replace_once(
              cert,
              '    private static let celestialManifest = "celestial/orbospine-celestial-manifest.json"\n',
              '    private static let celestialManifest = "celestial/orbospine-celestial-manifest.json"\n    private static let boundaryAnchors = "celestial/orbospine-boundary-anchors.csv"\n',
              'certification anchor path'
          )
          cert = replace_once(
              cert,
              '        print("PASS Pollux source: \\(supports.count) supports / \\(stations.count) stations")\n',
              '        print("PASS Pollux source: \\(supports.count) supports / \\(stations.count) stations")\n\n        let anchors = try loadBoundaryAnchors(\n            root: root,\n            files: candidate.files,\n            bone: schematic.bone\n        )\n        print("PASS Castor anchors: \\(anchors.count) exact Bone states")\n',
              'certification anchor load'
          )
          cert = replace_once(
              cert,
              '            celestialSupports: supports,\n            stations: stations,\n            retrogradePassages: [],\n',
              '            celestialSupports: supports,\n            stations: stations,\n            boundaryAnchors: anchors,\n            retrogradePassages: [],\n',
              'certification runtime handoff'
          )
          helper = '''    private static func loadBoundaryAnchors(
        root: URL,
        files: [CandidateFile],
        bone: OrboSpineBoneSpan
    ) throws -> [OrboSpineBoundaryAnchor] {
        guard let bound = files.first(where: { $0.path == boundaryAnchors }),
              bound.role == "celestial Bone boundary anchors" else {
            throw CertificationError.missing(boundaryAnchors)
        }

        let url = root.appendingPathComponent(bound.path)
        var result: [OrboSpineBoundaryAnchor] = []
        result.reserveCapacity(MundaneBody.canonicalOrder.count * 2)
        var seen = Set<String>()

        let count = try streamCSV(url) { header, fields, row in
            let bodyText = try text(fields, header, ["body"], url, row)
            guard let body = MundaneBody.canonicalOrder.first(where: {
                bodyKey($0.displayName) == bodyKey(bodyText)
            }) else {
                throw CertificationError.mismatch("boundary anchor row \\(row) body")
            }

            let boundaryText = try text(fields, header, ["boundary"], url, row)
            let boundary: OrboSpineBoundaryAnchorKind
            let expectedJulianDay: JulianDay
            switch boundaryText {
            case "z21_start":
                boundary = .start
                expectedJulianDay = bone.start
            case "z23_end_exclusive":
                boundary = .endExclusive
                expectedJulianDay = bone.end
            default:
                throw CertificationError.mismatch("boundary anchor row \\(row) side")
            }

            let jdValue = try double(fields, header, ["jd_ut"], url, row)
            let physical = try double(fields, header, ["physical_degree"], url, row)
            let speed = try double(
                fields,
                header,
                ["longitudinal_speed_degrees_per_day"],
                url,
                row
            )
            let motionText = try text(fields, header, ["motion"], url, row)
            let directionalValue = try double(fields, header, ["directional_degree"], url, row)
            let cell = try int(fields, header, ["navigation_cell"], url, row)

            guard let motion = Motion(rawValue: motionText),
                  (motion == .direct ? speed > 0 : speed < 0),
                  let jd = JulianDay(jdValue),
                  same(jd.value, expectedJulianDay.value),
                  let anchor = OrboSpineBoundaryAnchor(
                    body: body,
                    boundary: boundary,
                    julianDay: jd,
                    physicalDegrees: physical,
                    motion: motion
                  ),
                  same(anchor.directionalDegree.degrees, directionalValue),
                  anchor.navigationCell == cell else {
                throw CertificationError.mismatch("boundary anchor row \\(row) state")
            }

            let key = "\\(body.displayName)|\\(boundary.rawValue)"
            guard seen.insert(key).inserted else {
                throw CertificationError.mismatch("duplicate boundary anchor \\(key)")
            }
            result.append(anchor)
        }

        let expectedCount = MundaneBody.canonicalOrder.count * 2
        guard count == expectedCount, result.count == expectedCount else {
            throw CertificationError.mismatch(
                "boundary anchor rows \\(result.count) != \\(expectedCount)"
            )
        }
        for body in MundaneBody.canonicalOrder {
            for boundary in [
                OrboSpineBoundaryAnchorKind.start,
                OrboSpineBoundaryAnchorKind.endExclusive,
            ] {
                let key = "\\(body.displayName)|\\(boundary.rawValue)"
                guard seen.contains(key) else {
                    throw CertificationError.mismatch("missing boundary anchor \\(key)")
                }
            }
        }
        return result
    }

'''
          cert = replace_once(
              cert,
              '    private static func loadTerraRuntimeProbes(\n',
              helper + '    private static func loadTerraRuntimeProbes(\n',
              'certification anchor loader'
          )
          cert_path.write_text(cert)
          PY
      - name: Commit only Turn 3 files
        run: |
          git config user.name "huntarfischer"
          git config user.email "huntarfischer@gmail.com"
          git rm .github/workflows/orbospine-turn3-wire-anchors.yml
          git add \
            native/OrboCore/Sources/OrboCore/OrboSystem/OrboSpine/OrboSpineRuntime.swift \
            native/OrboCore/Sources/OrboSpineDioscuriCertificationTool/main.swift
          git commit -m "Wire Bone anchors into Castor certification"
          git push origin HEAD:feature/orbospine-forge-gather
