name: Orbo assembled app
on:
  push:
    branches: [feature/orbo-assembled-2026-09-02]
  workflow_dispatch:
concurrency:
  group: orbo-assembled-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-gate:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compile native owners and readers
        run: swift build --package-path native/OrboCore
      - name: Mount sealed Spine through the application reader
        run: swift run --package-path native/OrboCore OrboSpineAssemblyProofTool --build-root tools/pass5/orbospine-build
      - name: Build the iOS application
        run: xcodebuild build -project native/Orbo.xcodeproj -scheme Orbo -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
