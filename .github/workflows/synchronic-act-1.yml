name: Synchronic Act I upstream gate

on:
  push:
    branches:
      - feature/synchronic-spine-act-1

concurrency:
  group: synchronic-act-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-gate:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Ring focused proof
        run: swift test --package-path native/OrboCore --filter RingTests
      - name: Natal focused proof
        run: swift test --package-path native/OrboCore --filter NatalSpine
      - name: Full package regression, no exclusions
        run: swift test --package-path native/OrboCore
      - name: Select installed iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | ruby -rjson -e 'puts JSON.parse(STDIN.read)["devices"].values.flatten.find { |d| d["name"].start_with?("iPhone") }.fetch("udid")')
          echo "ORBO_SIMULATOR=$device_id" >> "$GITHUB_ENV"
      - name: Full accumulated Xcode suite
        run: >-
          xcodebuild test -project native/Orbo.xcodeproj -scheme Orbo
          -destination "platform=iOS Simulator,id=$ORBO_SIMULATOR"
          -parallel-testing-enabled NO
          -resultBundlePath "$RUNNER_TEMP/OrboTests.xcresult"
          CODE_SIGNING_ALLOWED=NO
      - name: Build OrboLab
        run: >-
          xcodebuild build -project native/Orbo.xcodeproj -scheme OrboLab
          -destination "platform=iOS Simulator,id=$ORBO_SIMULATOR"
          CODE_SIGNING_ALLOWED=NO
      - name: Preserve native test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orbo-Xcode-results
          path: ${{ runner.temp }}/OrboTests.xcresult
          if-no-files-found: ignore
