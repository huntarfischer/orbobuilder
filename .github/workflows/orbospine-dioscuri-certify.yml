name: OrboSpine Dioscuri Certification

on:
  push:
    branches:
      - feature/orbospine-forge-gather

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Prove OrboCore
        run: swift test --package-path native/OrboCore

      - name: Run Dioscuri certification
        run: |
          swift run --package-path native/OrboCore \
            OrboSpineDioscuriCertificationTool \
            --build-root tools/pass5/orbospine-build

      - name: Preserve Dioscuri testimony
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            tools/pass5/orbospine-build/orbospine-dioscuri-testimony.json \
            tools/pass5/orbospine-build/orbospine-dioscuri-testimony.sha256
          git commit -m "Preserve Dioscuri testimony for OrboSpine candidate [skip ci]"
          git push origin HEAD:feature/orbospine-forge-gather
