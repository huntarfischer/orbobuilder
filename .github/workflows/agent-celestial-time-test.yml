name: Agent Celestial Time Test

on:
  push:
    branches:
      - agent/timespine-celestial-time-build

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run OrboCore tests
        run: swift test --package-path native/OrboCore
