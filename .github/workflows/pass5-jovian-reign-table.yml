name: Pass 5 Jovian Reign Table

on:
  workflow_dispatch:
  push:
    branches:
      - agent/jovian-reign-table
    paths:
      - tools/pass5/generate_jovian_reign_table.py
      - .github/workflows/pass5-jovian-reign-table.yml

permissions:
  contents: write

env:
  SWISS_REPO: https://github.com/huntarfischer/swisseph.git
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  forge-jovian-reigns:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Jovian Reign branch
        uses: actions/checkout@v4
        with:
          ref: agent/jovian-reign-table
          fetch-depth: 0

      - name: Build pinned Swiss C
        shell: bash
        run: |
          set -euo pipefail
          SWISS="$RUNNER_TEMP/swisseph"
          git clone "$SWISS_REPO" "$SWISS"
          git -C "$SWISS" checkout "$SWISS_COMMIT"
          test "$(git -C "$SWISS" rev-parse HEAD)" = "$SWISS_COMMIT"
          make -C "$SWISS" libswe.so
          test -f "$SWISS/libswe.so"

      - name: Verify required DE441 files
        shell: bash
        run: |
          set -euo pipefail
          SWISS="$RUNNER_TEMP/swisseph"
          for file in \
            seplm36.se1 seplm30.se1 seplm24.se1 seplm18.se1 seplm12.se1 seplm06.se1 \
            sepl_00.se1 sepl_06.se1 sepl_12.se1 sepl_18.se1 sepl_24.se1; do
            test -f "$SWISS/ephe/$file"
            head -c 512 "$SWISS/ephe/$file" | strings | grep -q DE441
          done

      - name: Manufacture Jupiter Reign CSV
        shell: bash
        run: |
          set -euo pipefail
          OUT="tools/pass5/orbospine-build/shells/jovian-reign-table.csv"
          python3 tools/pass5/generate_jovian_reign_table.py \
            --library "$RUNNER_TEMP/swisseph/libswe.so" \
            --ephe-dir "$RUNNER_TEMP/swisseph/ephe" \
            --output "$OUT" \
            --source-commit "$SWISS_COMMIT"
          test -s "$OUT"

      - name: Audit Jupiter Reign CSV shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("tools/pass5/orbospine-build/shells/jovian-reign-table.csv")
          expected = [
              "shell_id", "ordinal", "planet", "family",
              "pre_shadow_start_jd_ut", "pre_shadow_start_utc", "pre_shadow_floor_degree",
              "first_aries_ingress_jd_ut", "first_aries_ingress_utc",
              "final_pisces_egress_jd_ut", "final_pisces_egress_utc",
              "next_shell_first_aries_ingress_jd_ut", "next_shell_first_aries_ingress_utc",
              "transition_crossings", "transition_crossing_count", "z21_z23_intersections",
          ]
          with path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
              assert f.seekable()
          assert rows
          assert list(rows[0].keys()) == expected
          assert rows[0]["shell_id"] == "J0"
          assert rows[0]["ordinal"] == "0"
          assert all(r["planet"] == "Jupiter" for r in rows)
          assert all(r["family"] == "Jovian Reign" for r in rows)
          assert all(r["shell_id"] == f"J{i}" and int(r["ordinal"]) == i for i, r in enumerate(rows))
          starts = [float(r["first_aries_ingress_jd_ut"]) for r in rows]
          nexts = [float(r["next_shell_first_aries_ingress_jd_ut"]) for r in rows]
          assert all(a < b for a, b in zip(starts, starts[1:]))
          assert all(abs(nexts[i] - starts[i + 1]) < 1e-9 for i in range(len(rows) - 1))
          for z in ("Z21", "Z22", "Z23"):
              assert any(z in r["z21_z23_intersections"].split(";") for r in rows)
          print({
              "status": "PASS",
              "rows": len(rows),
              "first": rows[0]["shell_id"],
              "last": rows[-1]["shell_id"],
              "z21": [r["shell_id"] for r in rows if "Z21" in r["z21_z23_intersections"].split(";")],
              "z22": [r["shell_id"] for r in rows if "Z22" in r["z21_z23_intersections"].split(";")],
              "z23": [r["shell_id"] for r in rows if "Z23" in r["z21_z23_intersections"].split(";")],
          })
          PY

      - name: Preserve forged Jupiter table
        uses: actions/upload-artifact@v4
        with:
          name: jovian-reign-table
          path: tools/pass5/orbospine-build/shells/jovian-reign-table.csv

      - name: Commit forged Jupiter table
        shell: bash
        run: |
          set -euo pipefail
          OUT="tools/pass5/orbospine-build/shells/jovian-reign-table.csv"
          git config user.name "Orbo Forge"
          git config user.email "orbo-forge@users.noreply.github.com"
          git pull --rebase origin agent/jovian-reign-table
          git add -f "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "Forge canonical Jovian Reign table [skip ci]"
            git push origin HEAD:agent/jovian-reign-table
          fi
