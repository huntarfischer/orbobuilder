name: Pass 5 P22 Boundary Material

on:
  workflow_dispatch:
  push:
    branches:
      - agent/p22-duplicate-cleanup-staging
    paths:
      - ".github/workflows/pass5-p22-boundary-material.yml"
      - "native/OrboCore/Package.swift"
      - "native/OrboCore/Sources/P22BoundaryForgeTool/**"
      - "native/OrboCore/Sources/OrboCore/Forge/MundaneTimespineP22ForgeRecipe.swift"

permissions:
  contents: write

env:
  SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

jobs:
  manufacture-boundary-material:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Orbo
        uses: actions/checkout@v4

      - name: Build pinned official Swiss C library
        run: |
          mkdir -p .forge/swisseph .forge/ephe
          git -C .forge/swisseph init
          git -C .forge/swisseph remote add origin https://github.com/aloistr/swisseph.git
          git -C .forge/swisseph fetch --depth 1 origin "$SWISS_COMMIT"
          git -C .forge/swisseph checkout --detach FETCH_HEAD
          make -C .forge/swisseph libswe.so
          test -f .forge/swisseph/libswe.so

      - name: Fetch pinned qualified Swiss DE441 files
        run: |
          base="https://raw.githubusercontent.com/aloistr/swisseph/$SWISS_COMMIT/ephe"
          for file in sepl_12.se1 semo_12.se1 sepl_18.se1 semo_18.se1; do
            curl --fail --location --retry 4 --retry-all-errors "$base/$file" --output ".forge/ephe/$file"
            head -c 512 ".forge/ephe/$file" | strings | grep -q DE441
          done

      - name: Manufacture exact P22 boundary states with native Forge tool
        run: |
          swift run \
            --package-path native/OrboCore \
            -c release \
            P22BoundaryForgeTool \
            --library "$PWD/.forge/swisseph/libswe.so" \
            --ephe-dir "$PWD/.forge/ephe" \
            --output "$PWD/tools/pass5/p22-data/p22-boundary-states.json"
          test -s tools/pass5/p22-data/p22-boundary-states.json
          sha256sum tools/pass5/p22-data/p22-boundary-states.json
          wc -c tools/pass5/p22-data/p22-boundary-states.json

      - name: Persist frozen boundary material on staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pass5/p22-data/p22-boundary-states.json
          if ! git diff --cached --quiet; then
            git commit -m "freeze P22 boundary state material"
            git push origin HEAD:agent/p22-duplicate-cleanup-staging
          fi
