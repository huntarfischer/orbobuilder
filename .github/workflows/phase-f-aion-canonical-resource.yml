`AionReading` is intentionally narrower than the concrete owner so later consumers can depend on temporal-address capability without depending on Aion storage, Forge representation, or AstroDNA verification internals.

## Parity standard

**STRUCTURAL**

Structural parity requires exact preservation of the earned chronology: the same canonical shell tables, shell numbering, 01...12 Aries...Pisces numbering, first-direct ownership law, retrograde-recross retention, half-open interval law, and resolved identity at a given Julian Day.

