      - name: Commit generated Aion resource and manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "orbo-forge"
          git config user.email "orbo-forge@users.noreply.github.com"
          git add -- native/OrboCore/Sources/OrboCore/Aion/Resources/aion-shell-sign-index-v1.json
          git add -- "specs/Native Port Manifest.md"
          if git diff --cached --quiet; then
