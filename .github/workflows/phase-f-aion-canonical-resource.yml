name: Phase F Aion Canonical Resource

on:
  push:
    branches: [phase-f-aion]
    paths:
      - "native/OrboCore/Tests/OrboCoreTests/AionCanonicalTests.swift"
      - "tools/pass5/generate_aion_runtime_index.py"
      - ".github/workflows/phase-f-aion-canonical-resource.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forge-and-prove:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manufacture canonical Aion runtime index
        run: |
          python tools/pass5/generate_aion_runtime_index.py \
            --source-dir tools/pass5/temporal-shells \
            --output native/OrboCore/Sources/OrboCore/Aion/Resources/aion-shell-sign-index-v1.json
          test -s native/OrboCore/Sources/OrboCore/Aion/Resources/aion-shell-sign-index-v1.json
          python - <<'PY'
          import json
          path = "native/OrboCore/Sources/OrboCore/Aion/Resources/aion-shell-sign-index-v1.json"
          data = json.load(open(path))
          counts = {k: len(v) for k, v in data["families"].items()}
          print(counts)
          assert set(counts) == {"F", "R", "W", "Z"}
          assert all(value > 0 for value in counts.values())
          PY

      - name: Run accumulated OrboCore tests against canonical Aion data
        run: swift test --package-path native/OrboCore

      - name: Record Aion native proof in manifest
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("specs/Native Port Manifest.md")
          text = path.read_text()

          text = text.replace("**Last updated:** 2026-08-16", "**Last updated:** 2026-08-20", 1)

          ledger_anchor = "| Mundane Timespine | PENDING | PENDING | OrboCore / MundaneTimespine | PASS 5 READY |\n| Timespine temporal lessons | PENDING | PENDING | PENDING | ARCHAEOLOGY CAPTURED |\n| Loom | PENDING | PENDING | PENDING | QUEUED |"
          ledger_replacement = "| Mundane Timespine | PENDING | PENDING | OrboCore / MundaneTimespine | PASS 5 ACTIVE |\n| Aion | REPRODUCE | STRUCTURAL | OrboCore / Aion | IMPLEMENTED / NATIVE PROVEN |\n| Timespine temporal lessons | PENDING | PENDING | PENDING | ARCHAEOLOGY CAPTURED |\n| Loom | PENDING | PENDING | PENDING | QUEUED |"
          if "| Aion | REPRODUCE | STRUCTURAL | OrboCore / Aion | IMPLEMENTED / NATIVE PROVEN |" not in text:
              if ledger_anchor not in text:
                  raise SystemExit("ledger anchor not found")
              text = text.replace(ledger_anchor, ledger_replacement, 1)

          closure_anchor = "# 14. Phase 1a Closure and Current Construction Boundary"
          if "# 14. Component: Aion" not in text:
              if closure_anchor not in text:
                  raise SystemExit("closure anchor not found")
              aion_card = r'''# 14. Component: Aion

## Prototype source

