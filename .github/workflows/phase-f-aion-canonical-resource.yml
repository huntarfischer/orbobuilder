Aion does not depend on Ephemeris and must never open it as a fallback.

## Current consumers

Aion exposes a deliberately narrow general-purpose read port:

```text
AionReading.resolve(at: JulianDay)
```

This leaves the temporal coordinate available to any later admitted consumer without coupling that consumer to AstroDNA internals or Pass 5 construction tables.

Expected consumers include the Ovum Resolver, Connectome construction, Hephaestus / child-spine manufacture, Synchronic temporal work, Electional, Horary, other timing systems, and OrboLab.

## User-visible consequence

Aion lets similar zodiacal skies carry different historical identities and preserves historical ownership through retrograde recrossings rather than making temporal addresses wobble backward.

## 4R

**REPRODUCE**

## Why

There is no coherent prototype Aion component to replicate. The useful law emerged from the temporal-shell chronology work and is reproduced natively as one compact Ovum reader.

The canonical shell tables remain construction authority. Aion is the runtime projection of those tables, not a new competing celestial source.

## Swift Sanding

```text
raw temporal-table scans in consumers
-> one Aion owner

runtime longitude / 30 sign inference
-> forbidden for Shell.sign ownership

one giant prewoven address atlas
