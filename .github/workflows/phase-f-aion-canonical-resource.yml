The canonical runtime index is manufactured from the authoritative Pass 5 `Shell.sign` tables rather than maintained as a second chronology.

The native resolver proves:

```text
four clocks resolve independently
half-open boundaries move ownership at the exact boundary
retrograde sign recrossing does not renumber Shell.sign
