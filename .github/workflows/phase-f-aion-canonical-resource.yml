Aion is the Ovum's sanctioned long-time coordinate reader.

It resolves one canonical Julian Day against four independent temporal clocks:

```text
Saturn   -> Frame       F
Uranus   -> Revolt      R
Neptune  -> Wave        W
Pluto    -> Zeitgeist   Z
```

and returns both shell identity and `Shell.sign` identity for each clock.

It also exposes an optional AstroDNA verification adapter for the four corresponding genes. AstroDNA is not required to read Aion.

## Actual law

Aion owns:

```text
Julian Day
-> active F / R / W / Z shells
-> active F.sign / R.sign / W.sign / Z.sign

half-open temporal ownership:
