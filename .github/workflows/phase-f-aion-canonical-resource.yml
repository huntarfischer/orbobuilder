```

## Native destination

```text
OrboCore / Aion
```

Aion belongs inside the Ovum beside the Mundane Timespine as a sanctioned read surface. It does not belong inside AstroDNA or the Connectome.

## Native dependencies

```text
JulianDay
Sign
AstroDNA, verification path only
Bundle.module runtime resource
