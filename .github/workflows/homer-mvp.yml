name: Homer MVP gate

on:
  push:
    branches:
      - feature/homer-mvp-2026-09-02
  workflow_dispatch:

concurrency:
  group: homer-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-gate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Homer connector contract tests
        run: swift test --package-path native/OrboCore --filter HomerPortTests
      - name: Homer end-to-end system tests
        run: swift test --package-path native/OrboCore --filter HomerSystemTests
      - name: Hecate Homer system tests
        run: swift test --package-path native/OrboCore --filter HecateHomerPortTests
      - name: Horae Homer system tests
        run: swift test --package-path native/OrboCore --filter HoraeHomerPortTests
      - name: Hermes Homer journey tests
        run: swift test --package-path native/OrboCore --filter HermesHomerPortTests
      - name: Orbo Homer lifecycle tests
        run: swift test --package-path native/OrboCore --filter OrboHomerPortTests
      - name: Orbo Homer downriver system tests
        run: swift test --package-path native/OrboCore --filter OrboHomerDownriverSystemTests
      - name: Homer three-port system tests
        run: swift test --package-path native/OrboCore --filter HomerThreePortSystemTests
      - name: Full package regression
        run: swift test --package-path native/OrboCore
