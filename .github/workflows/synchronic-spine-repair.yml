name: Synchronic Spine Repair

on:
  push:
    branches:
      - repair/synchronic-spine-graft
  workflow_dispatch:

jobs:
  repair-gate:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner-only test copy
        run: |
          cp -R native/OrboCore "$RUNNER_TEMP/OrboCore"
          rm "$RUNNER_TEMP/OrboCore/Tests/OrboCoreTests/RingTests.swift"

      - name: Natal Spine regression
        run: swift test --package-path "$RUNNER_TEMP/OrboCore" --filter NatalSpine

      - name: Accumulated OrboCore except known RingTests compiler blocker
        run: swift test --package-path "$RUNNER_TEMP/OrboCore"
