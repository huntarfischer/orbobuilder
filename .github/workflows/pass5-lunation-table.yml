name: Temporary Martian Campaign Forge Trigger

on:
  pull_request:
    branches:
      - agent/mundane-timespine-3d-build
    paths:
      - tools/pass5/generate_martian_campaign_table.py
      - .github/workflows/pass5-lunation-table.yml

permissions:
  contents: write

jobs:
  forge-martian-campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SWISS_REPO: https://github.com/huntarfischer/swisseph.git
      SWISS_COMMIT: 3fd0f956d73898b91cc4f67cf18b21af656d1342

    steps:
      - name: Checkout Mars forge branch
        uses: actions/checkout@v4
        with:
          ref: agent/martian-campaign-table
          fetch-depth: 0

      - name: Build pinned Swiss C
        shell: bash
        run: |
          set -euo pipefail
          SWISS="$RUNNER_TEMP/swisseph"
          git clone "$SWISS_REPO" "$SWISS"
          git -C "$SWISS" checkout "$SWISS_COMMIT"
          test "$(git -C "$SWISS" rev-parse HEAD)" = "$SWISS_COMMIT"
          make -C "$SWISS" libswe.so
          test -f "$SWISS/libswe.so"

      - name: Verify required DE441 planet files
        shell: bash
        run: |
          set -euo pipefail
          SWISS="$RUNNER_TEMP/swisseph"
          for file in \
            seplm36.se1 seplm30.se1 seplm24.se1 seplm18.se1 seplm12.se1 seplm06.se1 \
            sepl_00.se1 sepl_06.se1 sepl_12.se1 sepl_18.se1 sepl_24.se1; do
            test -f "$SWISS/ephe/$file"
            head -c 512 "$SWISS/ephe/$file" | strings | grep -q DE441
          done

      - name: Manufacture Mars Campaign CSV
        shell: bash
        run: |
          set -euo pipefail
          OUT="tools/pass5/orbospine-build/shells/martian-campaign-table.csv"
          python3 tools/pass5/generate_martian_campaign_table.py \
            --library "$RUNNER_TEMP/swisseph/libswe.so" \
            --ephe-dir "$RUNNER_TEMP/swisseph/ephe" \
            --output "$OUT" \
            --source-commit "$SWISS_COMMIT"
          test -s "$OUT"

      - name: Audit and commit Mars Campaign CSV
        shell: bash
        run: |
          set -euo pipefail
          OUT="tools/pass5/orbospine-build/shells/martian-campaign-table.csv"
          python3 - <<'PY'
          import csv
          import hashlib
          from pathlib import Path

          p = Path("tools/pass5/orbospine-build/shells/martian-campaign-table.csv")
          expected = [
              "shell_id", "ordinal", "planet", "family",
              "pre_shadow_start_jd_ut", "pre_shadow_start_utc", "pre_shadow_floor_degree",
              "first_aries_ingress_jd_ut", "first_aries_ingress_utc",
              "final_pisces_egress_jd_ut", "final_pisces_egress_utc",
              "next_shell_first_aries_ingress_jd_ut", "next_shell_first_aries_ingress_utc",
              "transition_crossings", "transition_crossing_count", "z21_z23_intersections",
          ]
          with p.open(newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              assert reader.fieldnames == expected
          assert rows and rows[0]["shell_id"] == "C0"
          assert all(r["shell_id"] == f"C{i}" and int(r["ordinal"]) == i for i, r in enumerate(rows))
          assert all(r["planet"] == "Mars" and r["family"] == "Martian Campaign" for r in rows)
          starts = [float(r["first_aries_ingress_jd_ut"]) for r in rows]
          nexts = [float(r["next_shell_first_aries_ingress_jd_ut"]) for r in rows]
          assert all(a < b for a, b in zip(starts, starts[1:]))
          assert all(abs(nexts[i] - starts[i + 1]) < 1e-9 for i in range(len(rows) - 1))
          for z in ("Z21", "Z22", "Z23"):
              assert any(z in r["z21_z23_intersections"].split(";") for r in rows)
          print("rows", len(rows))
          print("first", rows[0]["shell_id"], rows[0]["first_aries_ingress_utc"])
          print("last", rows[-1]["shell_id"], rows[-1]["first_aries_ingress_utc"])
          print("z21", [r["shell_id"] for r in rows if "Z21" in r["z21_z23_intersections"].split(";")])
          print("z22", [r["shell_id"] for r in rows if "Z22" in r["z21_z23_intersections"].split(";")])
          print("z23", [r["shell_id"] for r in rows if "Z23" in r["z21_z23_intersections"].split(";")])
          print("sha256", hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          git config user.name "Orbo Forge"
          git config user.email "orbo-forge@users.noreply.github.com"
          git pull --rebase origin agent/martian-campaign-table
          git add -f "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "Forge canonical Martian Campaign table [skip ci]"
            git push origin HEAD:agent/martian-campaign-table
          fi
