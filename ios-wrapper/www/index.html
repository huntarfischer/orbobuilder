  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

U5ErkJggg==\">\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  html, body { margin: 0; padding: 0; background: #0b081c; }\n  a { color: #4da4d9; text-decoration: none; }\n  a:hover { color: #7cc0e8; }\n  input { color-scheme: dark; }\n  input::placeholder { color: #5a5090; }\n  input[type=\"range\"] { accent-color: #e8ab41; }\n  input::-webkit-calendar-picker-indicator { margin: 0; padding: 0; }\n  /* the eclipse — first contact: the Sun's light flares warm at the Moon's limb, then settles */\n  @keyframes eclipseContact {\n    0% { opacity: 0; }\n    22% { opacity: 0.9; }\n    100% { opacity: 0; }\n  }\n  /* submenu ring entrance — two identical keyframes so the same animation can be\n     restarted on each sub-switch without a remount (alternate the name via subFlip) */\n  @keyframes subInA { from { opacity: 0; transform: scale(0.955); } to { opacity: 1; transform: scale(1); } }\n  @keyframes subInB { from { opacity: 0; transform: scale(0.955); } to { opacity: 1; transform: scale(1); } }\n<\u002Fstyle>\n<!-- Plain (non-module) script tags, each self-registering a window.__ORBO_* global.\n     Plain `src=` references are what the standalone bundler actually inlines \\u2014 an ES\n     `import './x.js'` inside an inline <script type=\"module\"> is invisible to it (it only\n     sees HTML attributes, not JS import specifiers), so bundled exports silently shipped\n     without the engine and the app hung at \"...\". These *.browser.js files are generated\n     from ephem.js/framing.js/transits.js/cities.js with exports rewritten to a plain global\n     assignment \\u2014 same math, zero ES-module surface. Regenerate them if the source .js\n     files change; don't hand-edit the .browser.js copies. -->\n<script src=\"fc84a195-6f13-41f9-99db-f5ccaa35c325\"><\u002Fscript>\n<script src=\"03d0df05-3703-4f7d-824b-91c9d4881860\"><\u002Fscript>\n<script src=\"63ed0e0a-280d-4731-8f1f-30b122e1b4e8\"><\u002Fscript>\n<script src=\"aca12f04-0571-47be-b485-93cfeae5827f\"><\u002Fscript>\n<script src=\"e793788f-652f-4be3-9cf9-b4cf40ed0a35\"><\u002Fscript>\n<script src=\"fc20aeee-37a6-483c-b7f2-088f845f5b08\"><\u002Fscript>\n<script src=\"65ca51a8-4bde-4666-a7ae-95c992931bec\"><\u002Fscript>\n<script src=\"4a072b75-7e78-44ea-bdd7-01988f49cc50\"><\u002Fscript>\n\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#0b081c;display:flex;justify-content:center;font-family:'Avenir Next','Century Gothic',Futura,'Trebuchet MS',sans-serif;color:#dcd7f0;\">\n  <div style=\"width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,0.85);background-color:#0c081f;background-image:linear-gradient(180deg, #0c081f 0%, #131a3e 24%, #26496e 46%, #7e5f2e 68%, #94522b 82%, #7c3a2f 94%, #632a2a 100%);background-repeat:no-repeat;background-size:100% 100%;\">\n    <div style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 31px 27px, rgba(246,244,255,0.95), transparent 60%),radial-gradient(1px 1px at 118px 63px, rgba(236,232,248,0.7), transparent 60%),radial-gradient(1.3px 1.3px at 74px 141px, rgba(196,208,248,0.8), transparent 60%),radial-gradient(0.9px 0.9px at 163px 108px, rgba(236,232,248,0.55), transparent 60%),radial-gradient(1.1px 1.1px at 22px 189px, rgba(255,240,220,0.6), transparent 60%),radial-gradient(0.8px 0.8px at 201px 161px, rgba(236,232,248,0.5), transparent 60%),radial-gradient(1.4px 1.4px at 147px 217px, rgba(214,224,255,0.75), transparent 60%),radial-gradient(0.9px 0.9px at 55px 88px, rgba(236,232,248,0.6), transparent 60%);background-size:231px 231px,199px 199px,253px 253px,181px 181px,269px 269px,211px 211px,241px 241px,223px 223px;mask-image:linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 34%, rgba(0,0,0,0.4) 52%, transparent 72%);-webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 34%, rgba(0,0,0,0.4) 52%, transparent 72%);\"><\u002Fdiv>\n    <div style=\"posi n 'sky';\n  }\n  // the current plate occupant as a readable chart: its body→longitude map, its ASC (for\n  // whole-sign houses), a display label + short chip name + accent. Natal | Synchronic\n  // Composite (you × now, live) | Natal Composite (you × B, minted). null = nothing engraved.\n  _plateChart() {\n    const s = this.state;\n    if (s.abComposite) {\n      this._ensureCompositeAB();\n      if (this.compAB) return { posMap: this.compAB, ascLon: this.compAB.cASC, label: 'You \\u00d7 ' + (s.abWith && s.abWith.name || 'them'), short: 'composite', color: '#dd8f78' };\n    }\n    if (s.composite && this.comp) {\n      const nat = this._natal();\n      return { posMap: this.comp, ascLon: this.comp.cASC != null ? this.comp.cASC : (nat ? nat.asc : 0), label: 'Composite me', short: 'synchronic', color: '#e8ab41' };\n    }\n    const nat = this._natal();\n    if (nat && nat.asc != null) return { posMap: nat.pos, ascLon: nat.asc, label: 'Natal me', short: 'natal', color: '#beb8e2' };\n    return null;\n  }\n  // one chart's body-by-body specifics: position, whole-sign house, and dispositor\n  // (sign ruler + the sign that ruler sits in — within this same chart). Chart-agnostic,\n  // so the plate and the seated rete person share it.\n  _specRows(posMap, ascLon) {\n    const ascSign = Math.floor(this.norm(ascLon) / 30);\n    return this.BODIES.filter((b) => posMap[b] != null).map((name) => {\n      const lon = this.norm(posMap[name]);\n      const sg = Math.floor(lon / 30);\n      const ruler = this.RULER_BY_SIGN[sg];\n      const rlon = posMap[ruler] != null ? this.norm(posMap[ruler]) : null;\n      const house = ((sg - ascSign + 12) % 12) + 1;\n      const rSign = rlon != null ? Math.floor(rlon / 30) : null;\n      return {\n        g: this.GLYPH[name], name: this.LABEL[name] || name,\n        gc: this.ELEM[sg % 4], glow: '0 0 10px ' + this.ELEM[sg % 4],\n        pos: this._fmtLong(lon), hse: String(house),\n        // dispositor as glyph + a sign chip tinted to the     let aspStr = null;\n    if (best) {\n      if (best.ang === 0 && best.r < 1.5) {\n        // overlap — the composite point sits on top of its target\n        aspStr = best.fam === 'natal' ? 'OVER ' + best.who : this.ASYM[0] + ' ' + best.who + ' \\u2014 STACKED';\n      } else {\n        const d = Math.floor(best.r), mm = String(Math.floor((best.r % 1) * 60)).padStart(2, '0');\n        aspStr = this.ASYM[best.ang] + ' ' + best.who + ' ' + d + '\\u00B0' + mm + '\\u2032 ' + (best.applying ? 'APPLYING' : 'SEPARATING');\n      }\n    }\n    // –– to-flip countdown: the bead runs its 180° channel (ends = natal ±90); reaching an end is\n    // the flip (transit hit natal opposition). off ∈ [-90,90] from center; near an end, count down. ––\n    let flipStr = null;\n    if (lon2 != null) {\n      const off = this.wrap(lon1 - natLon);\n      const rate = this.wrap(lon2 - lon1) / h; // bead deg/day (half the transit's)\n      if (Math.abs(rate) > 1e-9) {\n        const edge = rate > 0 ? 90 : -90, days = (edge - off) / rate;\n        if (days > 0 && Math.abs(off) > 70) flipStr = days < 0.021 ? 'AT FLIP' : 'FLIP IN ' + this._humanPeriod(days);\n      }\n    }\n    const parts = [];\n    if (aspStr) parts.push(aspStr);\n    if (flipStr) parts.push(flipStr);\n    return parts.length ? parts.join(' \\u00B7 ') : null;\n  }\n\n  _openSheet(name) {\n    this.setState({ sheet: name, sheetData: this._sheetData(name) });\n  }\n\n  // #9 — tap a natal engraving. A reading of YOU at that point: natal signification\n  // + the transits landing on it now. Flagged natal:true so _tick's live-refresh\n  // rebuilds the natal kind, not a same-named transit body.\n  _openNatalSheet(name) {\n    const sd = this._sheetDataNatal(name);\n    if (sd) this.setState({ sheet: name, sheetData: sd, lens: 'signif' });\n  }\n\n  _sheetDataNatal(name) {\n    const nat = this._natal();\n    const t = (this._natalTargets() || []).find((x) => x.name === name);\n    if (!nat || !t) return null;\n    const lon violet-tagged — same cut as the A plate, one size down\n          ctx.fillStyle = 'rgba(16,9,34,0.4)';\n          ctx.beginPath(); ctx.arc(x, y, 6.5, 0, 7); ctx.fill();\n          ctx.strokeStyle = 'rgba(' + ink + ',0.18)'; ctx.lineWidth = 1;\n          ctx.beginPath(); ctx.arc(x, y, 6.5, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();\n          ctx.font = '11px \"Noto Sans Symbols 2\",\"Segoe UI Symbol\",\"Apple Symbols\",serif';\n          ctx.save();\n          ctx.shadowColor = 'rgba(10,5,22,0.9)'; ctx.shadowBlur = 1.3; ctx.shadowOffsetY = -0.9;\n          ctx.fillStyle = 'rgba(' + ink + ',0.88)';\n          ctx.fillText(this.GLYPH[b], x, y + 0.4);\n          ctx.restore();\n        }\n        if (rc.asc != null) {\n          // the Ascendant is an engraving here too (O3), not a rim occupant — it rides B's\n          // own band alongside the rest, exactly where the A plate seats its own As.\n          const [ax3, ay3] = this._xy(rc.asc, rB);\n          ctx.fillStyle = 'rgba(16,9,34,0.4)';\n          ctx.beginPath(); ctx.arc(ax3, ay3, 7, 0, 7); ctx.fill();\n          ctx.strokeStyle = 'rgba(' + ink + ',0.18)'; ctx.lineWidth = 1;\n          ctx.beginPath(); ctx.arc(ax3, ay3, 7, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();\n          ctx.fillStyle = 'rgba(' + ink + ',0.92)';\n          ctx.font = 'bold 8px \"Avenir Next\",\"Century Gothic\",sans-serif';\n          ctx.fillText('As', ax3, ay3 + 0.3);\n        }\n      }\n    }\n\n    const ascCol = this._elemOf(this.asc);\n    const [ax1, ay1] = this._xy(this.asc, rAsp), [ax2, ay2] = this._xy(this.asc, R - 10);\n    ctx.strokeStyle = this.held === 'ASC' ? this._hexA(ascCol, 0.95) : this._hexA(ascCol, 0.5);\n    ctx.lineWidth = this.held === 'ASC' ? 2 : 1.3;\n    ctx.beginPath(); ctx.moveTo(ax1, ay1); ctx.lineTo(ax2, ay2); ctx.stroke();\n    const [alx, aly] = this._xy(this.asc, R + 1);\n    ctx.fillStyle = '#140e30';\n    ctx.beginPath(); ctx.arc(alx, aly, 11, 0, 7); ctx.fill();\n    ctx.strokeStyle = this._hexA(ascCol, this.held === 'ASC' ? 0.95 : 0.55); ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.arc(alx, aly, 11, 0, 7); ctx.stroke();\n    ctx.fillStyle = ascCol;\n    ctx.font = 'bold 11px \"Avenir Next\",\"Century Gothic\",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n    ctx.fillText('As', alx, aly);\n    this._screen = { ASC: [alx, aly] };\n\n    // MC/IC/DSC draw in the body loop below (Vertex's aesthetic) — permanent, ungrabbable;\n    // only As keeps a rim badge, so the horizon pulls focus among the four angles.\n\n    const order = act.map((n) => ({ n, lon: this.pos[n], lvl: 0 })).sort((p, q) => p.lon - q.lon);\n    let cluster = [];\n    const clusters = [];\n    for (const o of order) {\n      if (cluster.length && o.lon - cluster[cluster.length - 1].lon < 9) cluster.push(o);\n      else { cluster = [o]; clusters.push(cluster); }\n    }\n    for (const cl of clusters) {\n      [...cl].sort((p, q) => this.PERIODS[p.n] - this.PERIODS[q.n]).forEach((o, i) => { o.lvl = i % 2; });\n    }\n    const drawOrder = [...order].sort((p, q) => this.PERIODS[q.n] - this.PERIODS[p.n]);\n    for (const o of (skyOn ? drawOrder : [])) {\n      // conjunctions stack ALONG the rim (Vertex treatment): depth-of-field, never a drop\n      // onto the plate — the inner radius belongs to the natal/composite chart alone.\n      const r = rBody - o.lvl * 6;\n      const [x, y] = this._xy(o.lon, r);\n      const isHeld = this.held === o.n;\n      // sky notch — hangs from the rete's side down to the same boundary line the plate\n      // notches rise to: the two families protrude from either side of one shared circle.\n      // Drawn AFTER the glyph disc so it stays visible against the disc's lower rim.\n      const drawNotch = () => {\n        const [t1x, t1y] = this._xy(o.lon, rN + 16), [t2x, t2y] = this._xy(o.lon, rN + 11);\n        ctx.strokeStyle = isHeld ? 'rgba(232,171,65,0.95)' : 'rgba(220,214,240,0.5)';\n        ctx.lineWidth = isHeld ? 2 : 1;\n        ctx.beginPath(); ctx.moveTo(t1x, t1y); ctx.lineTo(t2x, t2y); ctx.stroke();\n      };\n      if (isHeld) {\n        ctx.strokeStyle = 'rgba(232,171,65,0.8)'; ctx.lineWidth = 1.4;\n        ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.stroke();\n        ctx.strokeStyle = 'rgba(232,171,65,0.25)';\n        const [dx1, dy1] = this._xy(o.lon, rAsp);\n        ctx.beginPath(); ctx.moveTo(dx1, dy1); ctx.lineTo(x, y); ctx.stroke();\n      }\n      const atRest = !this.held && !this.playing;\n      const elemColor = this._elemOf(o.lon);\n      const deep = o.lvl > 0 && !isHeld;\n      const base = 23 - 1.2 * Math.log10(this.PERIODS[o.n]);\n      // O3 — the angles (MC/IC/Vertex/DSC) leave the symbol-serif path: a quiet ~8.5px\n      // bold-sans badge in the As family, no backing disc, no ring, subordinate alpha.\n      const isAngle = o.n === 'MC' || o.n === 'IC' || o.n === 'Vertex' || o.n === 'DSC';\n      if (isAngle) {\n        const lab = { MC: 'MC', IC: 'IC', Vertex: 'Vx', DSC: 'DS' }[o.n] || o.n;\n        ctx.globalAlpha = deep ? 0.55 : 0.9;\n        ctx.fillStyle = isHeld ? '#e8ab41' : this._hexA(elemColor, 0.7);\n        ctx.shadowColor = isHeld ? '#e8ab41' : 'transparent';\n        ctx.shadowBlur = isHeld ? 8 : 0;\n        ctx.font = (isHeld ? 'bold 9.5' : 'bold 8.5') + 'px \"Avenir Next\",\"Century Gothic\",sans-serif';\n        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n        ctx.fillText(lab, x, y);\n        ctx.shadowBlur = 0; ctx.globalAlpha = 1;\n        drawNotch();\n        if (!this.ANGLE_PTS.includes(o.n)) this._screen[o.n] = [x, y];\n        continue;\n      }\n      ctx.fillStyle = deep ? 'rgba(14,9,36,0.55)' : 'rgba(14,9,36,0.35)';\n      ctx.beginPath(); ctx.arc(x, y, deep ? 9 : 11, 0, 7); ctx.fill();\n      if (deep) ctx.globalAlpha = 0.6;\n      ctx.fillStyle = isHeld ? '#e8ab41' : atRest ? elemColor : (o.n === 'Sun' || o.n === 'Moon') ? '#f6f2e4' : '#dcd7f0';\n      ctx.shadowColor = isHeld ? '#e8ab41' : atRest ? elemColor : 'rgba(240,238,252,0.8)';\n      ctx.shadowBlur = isHeld ? 14 : deep ? 3 : 6;\n      ctx.font = (isHeld ? 'bold ' : '') + (isHeld ? base + 2 : deep ? base - 3 : base).toFixed(1) + 'px \"Noto Sans Symbols 2\",\"Segoe UI Symbol\",\"Apple Symbols\",serif';\n      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n      if (o.n === 'Moon') {\n        // the Moon IS a moon — true terminator, lit limb facing the Sun across the wheel.\n        // scrub a week and watch it wax; conjunction goes dark, opposition fills.\n        const mr = isHeld ? 9.5 : deep ? 6.5 : 8;\n        const [sux, suy] = this._xy(this.pos.Sun, rBody);\n        const th = Math.atan2(suy - y, sux - x);\n        this._moonFace(ctx, x, y, mr, this.pos.Sun, this.pos.Moon, {\n          angle: th, lit: isHeld ? '#f0d9a0' : '#f6f2e4', dark: '#221a4a',\n          glow: 'rgba(246,242,228,0.6)', glowBlur: isHeld ? 12 : 5,\n          rimColor: 'rgba(246,242,228,0.35)', rimWidth: 0.8,\n        });\n      } else {\n        ctx.fillText(this.GLYPH[o.n], x, y);\n      }\n      ctx.shadowBlur = 0;\n      ctx.globalAlpha = 1;\n      drawNotch();\n      if (!this.ANGLE_PTS.includes(o.n)) this._screen[o.n] = [x, y];\n    }\n\n    if (this._pulse && this.held && this._screen[this.held]) {\n      const age = (performance.now() - this._pulse.t0) / 300;\n      if (age < 1) {\n        const k2 = this._pulse.kind;\n        const [px, py] = this._screen[this.held];\n        const rr = 16 + age * (k2 === 'deg' ? 9 : k2 === 'sign' ? 18 : 30);\n        ctx.strokeStyle = k2 === 'aspect' ? '#f2f0fc' : '#e8ab41';\n        ctx.globalAlpha = (1 - age) * (k2 === 'deg' ? 0.3 : k2 === 'sign' ? 0.55 : 0.85);\n        ctx.lineWidth = k2 === 'aspect' ? 2 : 1.3;\n        ctx.beginPath(); ctx.arc(px, py, rr, 0, 7); ctx.stroke();\n        ctx.globalAlpha = 1;\n      } else this._pulse = null;\n    }\n\n    ctx.strokeStyle = 'rgba(190,184,226,0.12)'; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.arc(cx, cy, 42, 0, 7); ctx.stroke();\n    if (this.state.settings.showPlayIcon) {\n      ctx.fillStyle = 'rgba(236,232,248,0.32)';\n      if (this.playing) {\n        ctx.fillRect(cx - 8, cy - 9, 5, 18); ctx.fillRect(cx + 3, cy - 9, 5, 18);\n      } else {\n        ctx.beginPath(); ctx.moveTo(cx - 6, cy - 10); ctx.lineTo(cx + 10, cy); ctx.lineTo(cx - 6, cy + 10); ctx.closePath(); ctx.fill();\n      }\n    }\n\n    // the eclipse — as the Moon-sheet rises, the instrument's light retreats. A shadow\n    // sweeps up from the lower limb, deepest nearest the Moon; the header (the depth-0\n    // readout) stays lit above. DOM veil handles the field; this handles the brass.\n    const ecl = this._eclipse || 0;\n    if (ecl > 0.01) {\n      const g = ctx.createLinearGradient(0, cy - R * 1.1, 0, cy + R * 1.15);\n      g.addColorStop(0, 'rgba(5,3,15,' + (0.30 * ecl).toFixed(3) + ')');\n      g.addColorStop(1, 'rgba(5,3,15,' + (0.68 * ecl).toFixed(3) + ')');\n      ctx.fillStyle = g;\n      ctx.fillRect(0, 0, w, cy + R * 1.4);\n    }\n  }\n\n  _fmtShort(lon) {\n    const s = Math.floor(this.norm(lon) / 30), d = Math.floor(this.norm(lon) % 30);\n    return d + '\\u00B0' + this.SIGNS[s] + '\\uFE0E';\n  }\n  _fmtLong(lon) {\n    const L = this.norm(lon), s = Math.floor(L / 30), d = Math.floor(L % 30), m = Math.floor((L % 1) * 60);\n    return d + '\\u00B0 ' + String(m).padStart(2, '0') + '\\u2032 ' + this.SIGN_NAMES[s];\n  }\n  _humanPeriod(d) {\n    if (d < 0.94) return (d * 24).toFixed(1) + ' hours';\n    if (d < 1.5) return '1 day';\n    if (d < 40) return d.toFixed(1) + ' days';\n    if (d < 400) return Math.round(d) + ' days';\n    return (d / 365.25).toFixed(1) + ' years';\n  }\n\n  _readouts() {\n    // S1: the header's own moon-face, kept as a plain sibling canvas (not torn down by the\n    // header text branches below) so it always draws, regardless of which chart owns the\n    // wheel. Re-scoped: it now sits INLINE between the pre- and post-moon text (see the\n    // template) exactly where the \\u263d glyph used to sit, so it doubles as that glyph instead\n    // of duplicating it \\u2014 one lunar mark, not two. The branches below drop the plain \\u263d\n    // character whenever the chip they're building is actually the Moon's (the resting/\n    // composite three-chip row, or a held/bead chip that happens to be the Moon), since the\n    // canvas is now standing in its place; any other chip (Sun, Mars, Asc…) still gets its\n    // own glyph text as before \\u2014 the canvas simply rides beside it, still always-on.\n    if (this.pos && this.moonHeadRef.current) {\n      const mctx = this.moonHeadRef.current.getContext('2d');\n      mctx.clearRect(0, 0, 32, 32);\n      // match whatever color the ticker is establishing for the Moon this frame — gilt in\n      // any composite context, elemental otherwise, neutral pale when nothing this frame\n      // names a moon at all (holding an unrelated hand).\n      const mCol = this._moonHeaderColor();\n      this._moonFace(mctx, 16, 16, 14, this.pos.Sun, this.pos.Moon, {\n        dark: '#140e30',\n        lit: mCol || '#f6f2e4',\n        rimColor: mCol ? this._hexA(mCol, 0.6) : 'rgba(220,214,240,0.35)',\n      });\n    }\n    const set = (ref, key, val) => {\n      if (this._lastReadout[key] !== val && ref.current) { ref.current.textContent = val; this._lastReadout[key] = val; }\n    };\n    const setH = (ref, key, val) => {\n      if (this._lastReadout[key] !== val && ref.current) { ref.current.innerHTML = val; this._lastReadout[key] = val; }\n    };\n    const dte = this.eph.jdToDate(this.jd);\n    set(this.civilRef, 'civil',\n      dte.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) +\n      ' \\u00B7 ' + dte.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' }));\n    const beadKey = this.held && this._heldBeadKey();\n    if (beadKey) {\n      // ♓ held bead — the readout speaks gilt: composite longitude + the half-gear sweep\n      const cLon = this.comp ? (beadKey === 'cASC' ? this.comp.cASC : this.comp[beadKey]) : null;\n      if (cLon != null) {\n        const beadGlyph = beadKey === 'cASC' ? 'As ' : (beadKey === 'Moon' ? '' : this.GLYPH[beadKey] + ' ');\n        setH(this.preMoonRef, 'skyPre', '');\n        setH(this.postMoonRef, 'skyPost', '<span style=\"color:#e8ab41\">' + beadGlyph + this._fmtLong(cLon) + '<\u002Fspan>');\n        const nm = beadKey === 'cASC' ? 'ASCENDANT' : (this.LABEL[beadKey] || beadKey).toUpperCase();\n        const per = this.PERIODS[beadKey === 'cASC' ? 'ASC' : beadKey] * 2 * (this._gearMult || 1);\n        const bs = this._beadStatus(beadKey);\n        set(this.gearRef, 'gear', 'COMPOSITE ' + nm + ' \\u00B7 ' + (bs || '1 SWEEP = ' + this._humanPeriod(per)));\n        return;\n      }\n    }\n    if (this.held) {\n      const isAsc = this.held === 'ASC';\n      const lon = isAsc ? this.asc : this.pos[this.held];\n      let rx = '';\n      if (!isAsc && !this.NO_RX.includes(this.held)) {\n        const ahead = this._posAt(this.jd + 0.2)[this.held];\n        if (this.wrap(ahead - lon) < 0) rx = ' \\u211E';\n      }\n      const heldGlyph = isAsc ? '<span style=\"color:' + this._elemOf(this.asc) + '\">As<\u002Fspan> ' : (this.held === 'Moon' ? '' : this.GLYPH[this.held] + ' ');\n      setH(this.preMoonRef, 'skyPre', '');\n      setH(this.postMoonRef, 'skyPost', heldGlyph + this._fmtLong(lon) + rx);\n      const asp = this._aspectStatus();\n      const label = isAsc ? 'HORIZON' : (this.LABEL[this.held] || this.held).toUpperCase();\n      set(this.gearRef, 'gear', asp ? label + ' ' + asp : label + ' HAND \\u00B7 1 SWEEP = ' + this._humanPeriod(this.PERIODS[this.held] * (this._gearMult || 1)));\n    } else {\n      // –– HEADER-COLOR RULE (the Derivation Law, documented as part of the O-block) ––\n      // The big-three readout is the depth-0 report of whichever chart OWNS THE WHEEL:\n      //   · sky owns it (default/live, or a frozen person/event whose sky we ease to)\n      //     → each of ☉/☽/As wears its element color — the sky-state language.\n      //   · a depth-3 entity owns it (solo composite: rete off + composite on)\n      //     → the readout golds, because the wheel is re-seated to the lived \"you × now\"\n      //       chart. This is the ONLY sanctioned override of the element-color language.\n      // A held hand or bead colors by what's held (handled in the branches above).\n      const sep = '<span style=\"color:#5a5090\">  \\u00B7  <\u002Fspan>';\n      const rr = this.state.rete;\n      if (rr === 'off' && this.state.composite && this.comp) {\n        // solo composite — the header speaks gilt: your lived Rising · Moon · Sun\n        setH(this.preMoonRef, 'skyPre', '<span style=\"color:#e8ab41\">As ' + this._fmtShort(this.comp.cASC) + '<\u002Fspan>' + sep);\n        setH(this.postMoonRef, 'skyPost',\n          '<span style=\"color:#e8ab41\">' + this._fmtShort(this.comp.Moon) + '<\u002Fspan>' + sep +\n          '<span style=\"color:#e8ab41\">\\u2609 ' + this._fmtShort(this.comp.Sun) + '<\u002Fspan>');\n      } else {\n        setH(this.preMoonRef, 'skyPre', '<span style=\"color:' + this._elemOf(this.asc) + '\">As ' + this._fmtShort(this.asc) + '<\u002Fspan>' + sep);\n        setH(this.postMoonRef, 'skyPost',\n          '<span style=\"color:' + this._elemOf(this.pos.Moon) + '\">' + this._fmtShort(this.pos.Moon) + '<\u002Fspan>' + sep +\n          '<span style=\"color:' + this._elemOf(this.pos.Sun) + '\">\\u2609 ' + this._fmtShort(this.pos.Sun) + '<\u002Fspan>');\n      }\n      const v = this.state.settings.playSpeed;\n      set(this.gearRef, 'gear', this.playing ? 'PLAYING \\u00B7 ' + v + (this.frame === 'horizon' ? ' MIN / SEC' : ' H / SEC') : this.live ? '\\u25CF LIVE' : this._reteFrozen() ? (this.state.rete.name || '').toUpperCase() : '\\u00A0');\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
